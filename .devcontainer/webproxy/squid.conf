# Forward proxy for coding-agent web tools (see .devcontainer/polytoken.md,
# "Web fetch and search"). The app container's egress firewall blocks most of
# the internet; this sidecar runs outside that firewall and fetches on the
# agent's behalf. Only clients on the compose network may use it.
http_port 3128

acl localnet src 172.16.0.0/12
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localnet
http_access deny all

# A pass-through proxy, not a cache: nothing an agent fetches is kept on disk.
cache deny all
# Logs stay at the image defaults (/var/log/squid/): the squid user cannot
# open /dev/stdout, so a stdio log line stops it at startup.

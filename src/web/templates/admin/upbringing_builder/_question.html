{% load upbringing_builder_tags %}
{% comment %}
One question, drawn as an admin panel: the `.module h2` header bar admin
already styles, then the field rows Django's own fieldset template renders
from `QUESTION_FIELDSETS`. Used for both a saved question and the
`<template>` the "Add question" button clones, so a cloned row looks like a
saved one (#3667).

Takes `question_form`, and `question_number` (blank for the unsaved clone).
{% endcomment %}
<div class="module question-module">
  <h2>
    {% if question_number %}Question {{ question_number }}{% else %}New question{% endif %}
    {% if question_form.instance.name %}&middot; {{ question_form.instance.name }}{% endif %}
    {% if question_form.instance.pk %}
    <span class="kind-chip">{{ question_form.instance.get_kind_display }}</span>
    <span class="kind-chip">{% if question_form.instance.is_required %}Required{% else %}Optional{% endif %}</span>
    {% endif %}
  </h2>

  {% if not question_form.instance.pk %}
  {% comment %}A question that is not saved yet has no chosen kind: the model
  default would otherwise advertise this new row as a write-in answer.{% endcomment %}
  {% elif question_form.instance.kind == "text" %}
  <div class="description">The player writes a free-text answer.</div>
  {% elif question_form.instance.kind == "pick" %}
  <div class="description">The player picks one priced answer from the list below.</div>
  {% elif question_form.instance.kind == "group" %}
  <div class="description">The player picks a group and one priced stance toward it.</div>
  {% elif question_form.instance.kind == "person" %}
  <div class="description">The player names someone of their own, optionally inside an
    earlier group question.</div>
  {% endif %}

  {% for hidden in question_form.hidden_fields %}{{ hidden }}{% endfor %}

  {% if question_form.non_field_errors %}
  <p class="errornote">{{ question_form.non_field_errors }}</p>
  {% endif %}

  {% for fieldset in question_form|question_fieldsets %}
    {% include "admin/includes/fieldset.html" with heading_level=3 prefix="q" id_prefix=question_form.prefix id_suffix=forloop.counter0 %}
  {% endfor %}

  {% if question_form.instance.pk %}
    {% if question_form.instance.kind == "pick" or question_form.instance.kind == "group" %}
      {% with slot_answers=answers|dict_get:question_form.instance.pk %}
      {% include "admin/upbringing_builder/_answers.html" with slot=question_form.instance formset=slot_answers %}
      {% endwith %}
      {% if question_form.instance.kind == "group" %}
        {% with matched=live.groups_by_slot|dict_get:question_form.instance.pk %}
        {% if matched is not None %}
        <p class="live-line">
          Matches {{ matched|length }} group{{ matched|length|pluralize }} today:
          {% for org in matched %}
          <a href="{% url 'admin:arxii_organization_change' org.pk %}">{{ org.name }}</a>{% if not forloop.last %}, {% endif %}
          {% endfor %}
        </p>
        {% endif %}
        {% endwith %}
      {% endif %}
    {% endif %}
  {% else %}
    <p class="help">{{ new_question_answers_help }}</p>
  {% endif %}
</div>

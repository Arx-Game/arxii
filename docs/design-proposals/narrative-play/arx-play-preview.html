  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);

  box-shadow: 0 0 0 2px var(--ring);
}

  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;

      color-mix(in srgb, var(--foreground) 7%, transparent)

  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

svg.lucide {

  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);

&lt;div id=&quot;arx-play&quot; data-direction=&quot;editorial&quot; data-mobile=&quot;story&quot; data-detail-open=&quot;false&quot; aria-label=&quot;Arx narrative play design&quot;&gt;
  &lt;header class=&quot;arx-header&quot;&gt;
    &lt;span class=&quot;arx-brand&quot;&gt;ARX &lt;span style=&quot;font-size:13px;letter-spacing:0&quot;&gt;II&lt;/span&gt;&lt;/span&gt;
    &lt;nav class=&quot;arx-mainnav&quot; aria-label=&quot;Play navigation&quot;&gt;&lt;button data-go=&quot;explore&quot;&gt;World&lt;/button&gt;&lt;button data-go=&quot;scene&quot;&gt;Scene&lt;/button&gt;&lt;button data-focus=&quot;journal&quot;&gt;Journal&lt;/button&gt;&lt;/nav&gt;
    &lt;button class=&quot;arx-row arx-id&quot; data-focus=&quot;self&quot; aria-label=&quot;Open your character&quot;&gt;&lt;span class=&quot;arx-avatar&quot;&gt;A&lt;/span&gt;&lt;span class=&quot;arx-identity-text&quot;&gt;&lt;strong&gt;Apostate&lt;/strong&gt;&lt;span class=&quot;arx-small&quot; style=&quot;display:block&quot;&gt;Playing as yourself&lt;/span&gt;&lt;/span&gt;&lt;/button&gt;
  &lt;/header&gt;
  &lt;div class=&quot;arx-layout&quot;&gt;
    &lt;aside class=&quot;arx-world&quot; aria-label=&quot;Surroundings and conversations&quot;&gt;&lt;/aside&gt;
    &lt;main class=&quot;arx-center&quot; aria-label=&quot;Narrative and writing&quot;&gt;&lt;/main&gt;
    &lt;aside class=&quot;arx-inspector&quot; aria-label=&quot;Context and character details&quot;&gt;&lt;/aside&gt;
  &lt;/div&gt;
  &lt;nav class=&quot;arx-mobile-nav&quot; aria-label=&quot;Workspace panes&quot;&gt;&lt;button data-mobile=&quot;world&quot;&gt;Surroundings&lt;/button&gt;&lt;button data-mobile=&quot;story&quot; aria-pressed=&quot;true&quot;&gt;Story&lt;/button&gt;&lt;button data-mobile=&quot;details&quot;&gt;Details&lt;/button&gt;&lt;/nav&gt;
  &lt;footer class=&quot;arx-note&quot;&gt;&lt;span&gt;Interactive concept · illustrative characters, places &amp;amp; rules&lt;/span&gt;&lt;span id=&quot;arx-feedback&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;Preview only · nothing is sent to Arx&lt;/span&gt;&lt;/footer&gt;
&lt;/div&gt;
&lt;script&gt;
(() =&gt; {
const root=document.getElementById(&#x27;arx-play&#x27;);
const opts={direction:&#x27;editorial&#x27;,moment:&#x27;scene&#x27;,proseSize:16};
const state={moment:&#x27;scene&#x27;,thread:&#x27;room&#x27;,focus:&#x27;moment&#x27;,location:&#x27;inn&#x27;,mobile:&#x27;story&#x27;,detailOpen:false,choice:&#x27;guard&#x27;,declared:false,mode:&#x27;pose&#x27;,drafts:{},posts:{},applause:new Set(),ooc:false};
const rooms={inn:{name:&#x27;The Gilded Lantern&#x27;,area:&#x27;The Lower Boroughs&#x27;,ambience:&#x27;Lamplight · rain at the windows&#x27;,description:&#x27;Rain follows you through the door, giving way to cedar smoke and the low murmur of conversation. Along the far wall, a hearth throws amber light over a gathering of mismatched chairs.&#x27;,detail:&#x27;A woman in a travel-worn coat turns a sealed letter between her fingers. By the window, two guests have drawn their chairs close together.&#x27;},court:{name:&#x27;Lantern Court&#x27;,area:&#x27;The Lower Boroughs&#x27;,ambience:&#x27;Dusk · a sheltered courtyard&#x27;,description:&#x27;Water pools between the cobblestones. A row of lanterns traces a path from the inn to the covered arcade; above it, the city rises in layers of slate and pale stone.&#x27;,detail:&#x27;The inn door is open behind you. For a moment, the courtyard belongs to the rain.&#x27;}};
const threadNames={room:&#x27;The whole room&#x27;,table:&#x27;By the hearth&#x27;,whisper:&#x27;A private word&#x27;,ooc:&#x27;Out of character&#x27;};
const audience={room:&#x27;Visible to the room&#x27;,table:&#x27;Visible to people at the hearth&#x27;,whisper:&#x27;Only you and Mira&#x27;,ooc:&#x27;OOC · visible to the room&#x27;};
const esc=s=&gt;String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
const $=s=&gt;root.querySelector(s);
const feedback=s=&gt;{$(&#x27;#arx-feedback&#x27;).textContent=s;};
function saveDraft(){const box=$(&#x27;textarea&#x27;);if(box)state.drafts[state.thread]=box.value;}
function setMoment(value){saveDraft();state.moment=value;opts.moment=value;state.thread=&#x27;room&#x27;;state.focus=value===&#x27;combat&#x27;?&#x27;combat&#x27;:&#x27;moment&#x27;;state.mobile=&#x27;story&#x27;;state.detailOpen=false;render();}
function focus(value){saveDraft();state.focus=value;state.detailOpen=true;if(root.clientWidth&lt;=560)state.mobile=&#x27;details&#x27;;render();}
function world(){const room=rooms[state.location];return `&lt;div class=&quot;arx-eyebrow&quot;&gt;Your surroundings&lt;/div&gt;&lt;h3&gt;${room.name}&lt;/h3&gt;&lt;p class=&quot;arx-small&quot;&gt;${room.area}&lt;/p&gt;&lt;button class=&quot;arx-navitem&quot; data-focus=&quot;room&quot;&gt;Read the room &lt;span style=&quot;margin-left:auto&quot;&gt;↗&lt;/span&gt;&lt;/button&gt;&lt;div class=&quot;arx-side-section&quot;&gt;&lt;div class=&quot;arx-eyebrow&quot;&gt;Conversations&lt;/div&gt;${state.moment===&#x27;lobby&#x27;?&#x27;&lt;p class=&quot;arx-small&quot;&gt;Enter the world to find your surroundings.&lt;/p&gt;&#x27;:state.location===&#x27;court&#x27;?&#x27;&lt;p class=&quot;arx-small&quot;&gt;A quiet moment. No one else is here.&lt;/p&gt;&#x27;:[[&#x27;room&#x27;,&#x27;The whole room&#x27;,&#x27;Shared conversation&#x27;],[&#x27;table&#x27;,&#x27;By the hearth&#x27;,&#x27;A small gathering&#x27;],[&#x27;whisper&#x27;,&#x27;A private word&#x27;,&#x27;You and Mira&#x27;]].map(([key,label,sub])=&gt;`&lt;button class=&quot;arx-navitem&quot; data-thread=&quot;${key}&quot; aria-pressed=&quot;${state.thread===key&amp;&amp;[&#x27;scene&#x27;,&#x27;combat&#x27;].includes(state.moment)}&quot;&gt;&lt;span&gt;${label}&lt;small&gt;${sub}&lt;/small&gt;&lt;/span&gt;${key===&#x27;whisper&#x27;&amp;&amp;state.thread!==&#x27;whisper&#x27;?&#x27;&lt;span class=&quot;arx-count&quot;&gt;1&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;arx-side-section&quot;&gt;&lt;div class=&quot;arx-eyebrow&quot;&gt;${state.location===&#x27;inn&#x27;?&#x27;Here with you&#x27;:&#x27;Nearby&#x27;}&lt;/div&gt;${state.location===&#x27;inn&#x27;?[&#x27;Mira&#x27;,&#x27;Cassian&#x27;,&#x27;Elian&#x27;].map((name,i)=&gt;`&lt;button class=&quot;arx-person&quot; data-focus=&quot;${name}&quot;&gt;&lt;span class=&quot;arx-avatar&quot;&gt;${name[0]}&lt;/span&gt;&lt;span&gt;${name}&lt;span class=&quot;arx-small&quot; style=&quot;display:block&quot;&gt;${[&#x27;At the hearth&#x27;,&#x27;By the window&#x27;,&#x27;At the bar&#x27;][i]}&lt;/span&gt;&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;):&#x27;&lt;p class=&quot;arx-small&quot;&gt;Light spills from the inn.&lt;/p&gt;&#x27;}&lt;/div&gt;&lt;div class=&quot;arx-side-section&quot;&gt;&lt;div class=&quot;arx-eyebrow&quot;&gt;Ways onward&lt;/div&gt;&lt;button class=&quot;arx-navitem&quot; data-travel=&quot;${state.location===&#x27;inn&#x27;?&#x27;court&#x27;:&#x27;inn&#x27;}&quot;&gt;${state.location===&#x27;inn&#x27;?&#x27;Lantern Court&#x27;:&#x27;The Gilded Lantern&#x27;} &lt;span style=&quot;margin-left:auto&quot;&gt;→&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;arx-side-section&quot;&gt;&lt;button class=&quot;arx-navitem&quot; data-thread=&quot;ooc&quot;&gt;Out of character&lt;/button&gt;&lt;button class=&quot;arx-navitem&quot; data-focus=&quot;boundaries&quot;&gt;Scene boundaries&lt;/button&gt;&lt;/div&gt;`;}
function pose(name,time,body,id,sub=&#x27;To the room&#x27;){return `&lt;article class=&quot;arx-pose&quot;&gt;&lt;div class=&quot;arx-author&quot;&gt;&lt;span class=&quot;arx-avatar&quot;&gt;${name[0]}&lt;/span&gt;&lt;span&gt;&lt;button data-focus=&quot;${name===&#x27;Apostate&#x27;?&#x27;self&#x27;:name}&quot;&gt;${name}&lt;/button&gt;&lt;span class=&quot;arx-small&quot; style=&quot;display:block&quot;&gt;${sub}&lt;/span&gt;&lt;/span&gt;&lt;time&gt;${time}&lt;/time&gt;&lt;/div&gt;&lt;div class=&quot;arx-prose&quot;&gt;${body}&lt;/div&gt;&lt;div class=&quot;arx-pose-actions&quot;&gt;&lt;button data-reply=&quot;${name}&quot;&gt;Respond&lt;/button&gt;&lt;button data-applaud=&quot;${id}&quot; aria-pressed=&quot;${state.applause.has(id)}&quot;&gt;${state.applause.has(id)?&#x27;Applauded&#x27;:&#x27;Applaud&#x27;}&lt;/button&gt;&lt;/div&gt;&lt;/article&gt;`;}
function feed(){let content=&#x27;&#x27;;if(state.thread===&#x27;whisper&#x27;)content=`&lt;div class=&quot;arx-divider&quot;&gt;Private · you and Mira&lt;/div&gt;${pose(&#x27;Mira&#x27;,&#x27;8:34&#x27;,&#x27;&lt;p&gt;“There is something I could not say in front of the others. Did anyone follow you here?”&lt;/p&gt;&#x27;,&#x27;w1&#x27;,&#x27;Whisper to Apostate&#x27;)}`;else if(state.thread===&#x27;table&#x27;)content=`&lt;div class=&quot;arx-divider&quot;&gt;At the hearth&lt;/div&gt;${pose(&#x27;Mira&#x27;,&#x27;8:32&#x27;,&#x27;&lt;p&gt;Mira shifts her chair to make room. “Come closer. You look half-frozen.”&lt;/p&gt;&#x27;,&#x27;t1&#x27;,&#x27;To the hearth&#x27;)}${pose(&#x27;Elian&#x27;,&#x27;8:33&#x27;,&#x27;&lt;p&gt;Elian nudges an untouched cup across the table. “You arrived before the story. That is what matters.”&lt;/p&gt;&#x27;,&#x27;t2&#x27;,&#x27;To the hearth&#x27;)}`;else if(state.thread===&#x27;ooc&#x27;)content=`&lt;div class=&quot;arx-divider&quot;&gt;Out of character · room participants&lt;/div&gt;${pose(&#x27;Cassian&#x27;,&#x27;8:30&#x27;,&#x27;&lt;p&gt;I have about an hour tonight. Happy to follow wherever this goes!&lt;/p&gt;&#x27;,&#x27;o1&#x27;,&#x27;OOC&#x27;)}`;else content=`&lt;div class=&quot;arx-divider&quot;&gt;${state.moment===&#x27;combat&#x27;?&#x27;The scene continues&#x27;:&#x27;You arrived at the Lantern&#x27;}&lt;/div&gt;${pose(&#x27;Mira&#x27;,&#x27;8:32&#x27;,&#x27;&lt;p&gt;Mira turns at the sound of the door. For a moment, the letter rests forgotten in her hand.&lt;/p&gt;&lt;p&gt;“You came.” There is relief in her voice, though she tries to hide it. “I was beginning to think the rain had won.”&lt;/p&gt;&#x27;,&#x27;r1&#x27;)}${pose(&#x27;Cassian&#x27;,&#x27;8:33&#x27;,&#x27;&lt;p&gt;From his seat by the window, Cassian raises his glass in silent greeting. His attention returns to the street a little too quickly.&lt;/p&gt;&#x27;,&#x27;r2&#x27;)}${state.moment===&#x27;combat&#x27;?&#x27;&lt;div class=&quot;arx-narration&quot;&gt;&lt;span class=&quot;arx-eyebrow&quot;&gt;The scene changes&lt;/span&gt;&lt;p&gt;The door strikes the wall. A cloaked figure steps inside, blade drawn. Mira backs toward the hearth.&lt;/p&gt;&lt;/div&gt;&#x27;:&#x27;&lt;div class=&quot;arx-narration&quot;&gt;&lt;span class=&quot;arx-eyebrow&quot;&gt;The scene around you&lt;/span&gt;&lt;p&gt;A gust worries the shutters. Conversation softens, then returns beneath the sound of the rain.&lt;/p&gt;&lt;/div&gt;&#x27;}`;
if(state.declared&amp;&amp;state.moment===&#x27;combat&#x27;&amp;&amp;state.thread===&#x27;room&#x27;)content+=&#x27;&lt;div class=&quot;arx-narration&quot;&gt;&lt;span class=&quot;arx-eyebrow&quot;&gt;Your declaration&lt;/span&gt;&lt;p&gt;&#x27;+({guard:&#x27;You intend to protect Mira.&#x27;,retreat:&#x27;You intend to withdraw to the doorway.&#x27;,strike:&#x27;You intend to confront the intruder.&#x27;}[state.choice])+&#x27; Waiting for the round to resolve.&lt;/p&gt;&lt;/div&gt;&#x27;;
return content+(state.posts[state.thread]||[]).map((post,i)=&gt;pose(&#x27;Apostate&#x27;,&#x27;Now&#x27;,`&lt;p&gt;${esc(post.text)}&lt;/p&gt;`,&#x27;mine&#x27;+state.thread+i,post.mode===&#x27;ooc&#x27;?&#x27;OOC&#x27;:audience[state.thread])).join(&#x27;&#x27;);}
function center(){const room=rooms[state.location];if(state.moment===&#x27;lobby&#x27;)return `&lt;div class=&quot;arx-explore&quot;&gt;&lt;div class=&quot;arx-eyebrow&quot;&gt;Your next chapter&lt;/div&gt;&lt;h1&gt;Step back&lt;br&gt;into the world.&lt;/h1&gt;&lt;p class=&quot;arx-prose&quot;&gt;The city carries on in your absence.&lt;br&gt;Tonight, a door is still open.&lt;/p&gt;&lt;div class=&quot;arx-entry-card&quot;&gt;&lt;div class=&quot;arx-row&quot;&gt;&lt;span class=&quot;arx-avatar&quot;&gt;A&lt;/span&gt;&lt;h3&gt;Apostate&lt;/h3&gt;&lt;/div&gt;&lt;p&gt;Last location · ${room.name}&lt;/p&gt;&lt;button class=&quot;arx-primary&quot; data-go=&quot;explore&quot;&gt;Enter as Apostate →&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;arx-location-rule&quot;&gt;&lt;/div&gt;&lt;p class=&quot;arx-small&quot;&gt;You decide where to go and whom to approach.&lt;/p&gt;&lt;/div&gt;`;
if(state.moment===&#x27;explore&#x27;)return `&lt;div class=&quot;arx-explore&quot;&gt;&lt;div class=&quot;arx-eyebrow&quot;&gt;${room.area} / You are here&lt;/div&gt;&lt;h1&gt;${room.name}&lt;/h1&gt;&lt;p class=&quot;arx-small&quot;&gt;${room.ambience}&lt;/p&gt;&lt;div class=&quot;arx-location-rule&quot;&gt;&lt;/div&gt;&lt;div class=&quot;arx-prose&quot;&gt;&lt;p&gt;${room.description}&lt;/p&gt;&lt;p&gt;${room.detail}&lt;/p&gt;&lt;/div&gt;${state.location===&#x27;inn&#x27;?&#x27;&lt;div class=&quot;arx-entry-card&quot;&gt;&lt;div class=&quot;arx-eyebrow&quot;&gt;A gathering · open to join&lt;/div&gt;&lt;h3&gt;A letter in the rain&lt;/h3&gt;&lt;p&gt;Mira, Cassian and Elian are here. There is room for another voice.&lt;/p&gt;&lt;button class=&quot;arx-primary&quot; data-go=&quot;scene&quot;&gt;Approach the gathering →&lt;/button&gt;&lt;/div&gt;&#x27;:&#x27;&lt;div class=&quot;arx-entry-card&quot;&gt;&lt;h3&gt;A moment to yourself&lt;/h3&gt;&lt;p&gt;No active scene here. Explore your surroundings or return to the gathering.&lt;/p&gt;&lt;button class=&quot;arx-primary&quot; data-travel=&quot;inn&quot;&gt;Return to the Lantern →&lt;/button&gt;&lt;/div&gt;&#x27;}&lt;div class=&quot;arx-detail-block&quot;&gt;&lt;div class=&quot;arx-eyebrow&quot;&gt;Within reach&lt;/div&gt;&lt;div class=&quot;arx-place-list&quot;&gt;&lt;button data-focus=&quot;${state.location===&#x27;inn&#x27;?&#x27;letter&#x27;:&#x27;lanterns&#x27;}&quot;&gt;${state.location===&#x27;inn&#x27;?&#x27;A sealed letter&#x27;:&#x27;The lanterns&#x27;} &lt;span&gt;Examine ↗&lt;/span&gt;&lt;/button&gt;&lt;button data-travel=&quot;${state.location===&#x27;inn&#x27;?&#x27;court&#x27;:&#x27;inn&#x27;}&quot;&gt;${state.location===&#x27;inn&#x27;?&#x27;The open doorway&#x27;:&#x27;The inn doorway&#x27;} &lt;span&gt;Go through →&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`;
return `&lt;div class=&quot;arx-scene-heading&quot;&gt;&lt;div class=&quot;arx-row arx-between&quot;&gt;&lt;span class=&quot;arx-eyebrow&quot;&gt;${room.name}&lt;/span&gt;&lt;span class=&quot;arx-tag&quot;&gt;${state.moment===&#x27;combat&#x27;?&#x27;Encounter · round 2&#x27;:&#x27;Live scene&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;h1&gt;A letter in the rain&lt;/h1&gt;&lt;div class=&quot;arx-row arx-between&quot;&gt;&lt;span class=&quot;arx-small&quot;&gt;Four voices · ${state.moment===&#x27;combat&#x27;?&#x27;The stakes have changed&#x27;:&#x27;A chance meeting on a rainy evening&#x27;}&lt;/span&gt;&lt;button class=&quot;arx-focus-return arx-small&quot; data-focus=&quot;${state.moment===&#x27;combat&#x27;?&#x27;combat&#x27;:&#x27;moment&#x27;}&quot;&gt;Details ↗&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;arx-viewbar&quot;&gt;&lt;strong&gt;${threadNames[state.thread]}&lt;/strong&gt;&lt;span style=&quot;flex:1&quot;&gt;&lt;/span&gt;&lt;button data-focus=&quot;audience&quot;&gt;${state.thread===&#x27;whisper&#x27;?&#x27;Private&#x27;:&#x27;Audience&#x27;} ↗&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;arx-feed&quot; tabindex=&quot;0&quot; aria-label=&quot;${threadNames[state.thread]} narrative&quot;&gt;${feed()}&lt;/div&gt;&lt;form class=&quot;arx-composer&quot;&gt;&lt;div class=&quot;arx-composer-label&quot;&gt;&lt;strong&gt;Writing as Apostate&lt;/strong&gt;&lt;span class=&quot;arx-gold&quot;&gt;${audience[state.thread]}&lt;/span&gt;&lt;/div&gt;&lt;label for=&quot;arx-draft&quot; class=&quot;arx-small&quot;&gt;${state.thread===&#x27;whisper&#x27;?&#x27;Your private reply&#x27;:&#x27;Your next contribution&#x27;}&lt;/label&gt;&lt;textarea id=&quot;arx-draft&quot; placeholder=&quot;${state.thread===&#x27;whisper&#x27;?&#x27;Write a private reply to Mira…&#x27;:&#x27;What does Apostate say or do?&#x27;}&quot;&gt;${esc(state.drafts[state.thread]||&#x27;&#x27;)}&lt;/textarea&gt;&lt;div class=&quot;arx-compose-bottom&quot;&gt;&lt;div class=&quot;arx-row&quot;&gt;&lt;select aria-label=&quot;Writing mode&quot;&gt;&lt;option value=&quot;pose&quot;&gt;Roleplay&lt;/option&gt;&lt;option value=&quot;ooc&quot; ${state.mode===&#x27;ooc&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;OOC&lt;/option&gt;&lt;/select&gt;&lt;button type=&quot;button&quot; data-focus=&quot;actions&quot;&gt;+ Action&lt;/button&gt;&lt;/div&gt;&lt;button class=&quot;arx-primary&quot; type=&quot;submit&quot;&gt;${state.thread===&#x27;whisper&#x27;?&#x27;Send to Mira&#x27;:&#x27;Share with &#x27;+(state.thread===&#x27;table&#x27;?&#x27;the hearth&#x27;:&#x27;the room&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;/form&gt;`;}
function inspector(){const back=&#x27;&lt;button class=&quot;arx-small&quot; data-close&gt;← Back to the scene&lt;/button&gt;&#x27;;const f=state.focus;

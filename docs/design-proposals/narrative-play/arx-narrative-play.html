#arx-play .arx-center{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--arx-page)} #arx-play .arx-scene-heading{padding:24px 26px 17px;border-bottom:1px solid var(--arx-line)} #arx-play .arx-scene-heading h1{margin:8px 0 11px} #arx-play .arx-scene-heading .arx-small{line-height:1.6} #arx-play .arx-tag{display:inline-block;padding:3px 7px;background:var(--arx-wash);font-size:11px;border-radius:4px;color:var(--arx-gold)} #arx-play .arx-viewbar{padding:10px 24px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--arx-line);font-size:12px} #arx-play .arx-viewbar button{padding:5px 7px} #arx-play .arx-feed{overflow-y:auto;flex:1;min-height:0;padding:21px 27px;scroll-behavior:auto} #arx-play .arx-feed .arx-divider{display:flex;align-items:center;gap:10px;color:var(--arx-muted);font-size:11px;margin:0 0 22px} #arx-play .arx-divider:before,#arx-play .arx-divider:after{content:'';height:1px;flex:1;background:var(--arx-line)}

#arx-play .arx-inspector{padding:22px 18px;background:var(--arx-panel);border-left:1px solid var(--arx-line);overflow-y:auto} #arx-play .arx-inspector h2{margin:9px 0 11px} #arx-play .arx-inspector p{font-size:13px;line-height:1.65} #arx-play .arx-detail-block{padding:18px 0;border-bottom:1px solid var(--arx-line)} #arx-play .arx-detail-block h3{font-size:17px;margin:0 0 9px} #arx-play .arx-detail-block .arx-eyebrow{margin-bottom:8px} #arx-play .arx-choice{width:100%;border:1px solid var(--arx-line);margin-top:8px;padding:12px} #arx-play .arx-choice[aria-pressed=true]{border-color:var(--arx-gold);background:var(--arx-wash)} #arx-play .arx-choice small{display:block;font-size:12px;color:var(--arx-muted);margin-top:5px} #arx-play .arx-inspector .arx-primary{width:100%;margin-top:12px}
#arx-play .arx-explore{padding:34px 30px;overflow-y:auto;flex:1} #arx-play .arx-explore h1{font-size:39px;line-height:1.15;margin:12px 0 22px} #arx-play .arx-explore .arx-prose{font-size:18px;line-height:1.8} #arx-play .arx-explore .arx-eyebrow{margin-bottom:9px} #arx-play .arx-location-rule{height:4px;width:48px;background:var(--arx-gold);margin:25px 0} #arx-play .arx-entry-card{border:1px solid var(--arx-line);border-radius:8px;padding:19px;margin-top:24px;background:var(--arx-bg)} #arx-play .arx-entry-card h3{font-size:23px;margin:6px 0 9px} #arx-play .arx-entry-card p{font-size:13px;color:var(--arx-muted);margin-bottom:16px} #arx-play .arx-place-list{display:grid;gap:4px;margin-top:12px} #arx-play .arx-place-list button{border-bottom:1px solid var(--arx-line);border-radius:0;display:flex;justify-content:space-between;padding:12px 0}
#arx-play .arx-map{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0} #arx-play .arx-map>div{padding:12px 7px;border:1px solid var(--arx-line);border-radius:5px;font-size:12px;text-align:center} #arx-play .arx-map small{display:block;color:var(--arx-muted);font-size:11px;margin-top:5px} #arx-play .arx-map .arx-here{border-color:var(--arx-gold);background:var(--arx-wash)} #arx-play .arx-alert{color:var(--arx-alert)} #arx-play .arx-stat{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px solid var(--arx-line)} #arx-play .arx-note{border-top:1px solid var(--arx-line);padding:7px 16px;font-size:11px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--arx-panel);color:var(--arx-muted)} #arx-play .arx-note button{font-size:11px;padding:3px 6px} #arx-play .arx-mobile-nav{display:none} #arx-play .arx-focus-return{display:none}
#arx-play[data-direction=social] .arx-prose{font-family:'Segoe UI',sans-serif;font-size:14px;line-height:1.7} #arx-play[data-direction=social] .arx-pose{border:1px solid var(--arx-line);border-radius:10px;background:var(--arx-bg);padding:13px;margin-bottom:13px} #arx-play[data-direction=social] .arx-layout{grid-template-columns:185px minmax(0,1fr) 242px} #arx-play[data-direction=reading] .arx-layout{grid-template-columns:176px minmax(0,1fr)} #arx-play[data-direction=reading] .arx-inspector{display:none} #arx-play[data-direction=reading] .arx-prose{max-width:64ch;font-size:18px} #arx-play[data-direction=reading] .arx-feed{padding:28px 40px} #arx-play[data-direction=reading][data-detail-open=true] .arx-inspector{display:block;position:absolute;right:0;top:64px;bottom:32px;width:min(320px,100%);z-index:4;box-shadow:-15px 0 30px #0002} #arx-play[data-direction=reading] .arx-focus-return{display:inline-block}
@media(max-width:850px){#arx-play .arx-layout,#arx-play[data-direction=social] .arx-layout{grid-template-columns:173px minmax(0,1fr)} #arx-play .arx-inspector{display:none} #arx-play[data-detail-open=true] .arx-inspector{display:block;position:absolute;right:0;top:64px;bottom:33px;width:285px;z-index:4;box-shadow:-15px 0 30px #0002} #arx-play .arx-focus-return{display:inline-block} #arx-play .arx-header{gap:12px;padding:12px} #arx-play .arx-id .arx-small{display:none} #arx-play .arx-scene-heading{padding:20px} #arx-play .arx-feed{padding:20px} }
@media(max-width:560px){#arx-play{border-radius:8px} #arx-play .arx-header{min-height:59px;gap:8px;flex-wrap:wrap} #arx-play .arx-brand{font-size:22px} #arx-play .arx-mainnav{gap:0} #arx-play .arx-mainnav button{font-size:12px;padding:7px} #arx-play .arx-id{padding-left:6px;border:0} #arx-play .arx-id .arx-identity-text{display:none} #arx-play .arx-layout,#arx-play[data-direction=social] .arx-layout,#arx-play[data-direction=reading] .arx-layout{display:block;height:750px} #arx-play .arx-center{height:100%} #arx-play .arx-world,#arx-play .arx-inspector{display:none} #arx-play[data-mobile=world] .arx-world{display:block;height:100%;border:0} #arx-play[data-mobile=world] .arx-center,#arx-play[data-mobile=details] .arx-center{display:none} #arx-play[data-mobile=details] .arx-inspector,#arx-play[data-direction=reading][data-mobile=details] .arx-inspector{display:block;position:static;width:100%;height:100%;box-shadow:none;border:0} #arx-play .arx-mobile-nav{display:flex;justify-content:space-around;border-top:1px solid var(--arx-line);padding:7px;background:var(--arx-panel)} #arx-play .arx-mobile-nav button{font-size:12px;padding:8px 14px} #arx-play .arx-mobile-nav button[aria-pressed=true]{background:var(--arx-wash);color:var(--arx-gold)} #arx-play .arx-scene-heading{padding:18px} #arx-play .arx-scene-heading h1{font-size:27px} #arx-play .arx-feed,#arx-play[data-direction=reading] .arx-feed{padding:18px} #arx-play .arx-composer{padding:12px} #arx-play .arx-explore{padding:25px 21px} #arx-play .arx-explore h1{font-size:34px} #arx-play .arx-viewbar{padding:9px 14px} #arx-play .arx-note{font-size:10px;align-items:flex-start} #arx-play .arx-note span:first-child{max-width:230px} #arx-play .arx-compose-bottom{flex-wrap:wrap} }
</style>
<div id="arx-play" data-direction="editorial" data-mobile="story" data-detail-open="false" aria-label="Arx narrative play design">
  <header class="arx-header">
    <span class="arx-brand">ARX <span style="font-size:13px;letter-spacing:0">II</span></span>
    <nav class="arx-mainnav" aria-label="Play navigation"><button data-go="explore">World</button><button data-go="scene">Scene</button><button data-focus="journal">Journal</button></nav>
    <button class="arx-row arx-id" data-focus="self" aria-label="Open your character"><span class="arx-avatar">A</span><span class="arx-identity-text"><strong>Apostate</strong><span class="arx-small" style="display:block">Playing as yourself</span></span></button>
  </header>
  <div class="arx-layout">
    <aside class="arx-world" aria-label="Surroundings and conversations"></aside>
    <main class="arx-center" aria-label="Narrative and writing"></main>
    <aside class="arx-inspector" aria-label="Context and character details"></aside>
  </div>
  <nav class="arx-mobile-nav" aria-label="Workspace panes"><button data-mobile="world">Surroundings</button><button data-mobile="story" aria-pressed="true">Story</button><button data-mobile="details">Details</button></nav>
  <footer class="arx-note"><span>Interactive concept · illustrative characters, places &amp; rules</span><span id="arx-feedback" role="status" aria-live="polite">Preview only · nothing is sent to Arx</span></footer>
</div>
<script>
(() => {
const root=document.getElementById('arx-play');
const opts={direction:'editorial',moment:'scene',proseSize:16};
const state={moment:'scene',thread:'room',focus:'moment',location:'inn',mobile:'story',detailOpen:false,choice:'guard',declared:false,mode:'pose',drafts:{},posts:{},applause:new Set(),ooc:false};
const rooms={inn:{name:'The Gilded Lantern',area:'The Lower Boroughs',ambience:'Lamplight · rain at the windows',description:'Rain follows you through the door, giving way to cedar smoke and the low murmur of conversation. Along the far wall, a hearth throws amber light over a gathering of mismatched chairs.',detail:'A woman in a travel-worn coat turns a sealed letter between her fingers. By the window, two guests have drawn their chairs close together.'},court:{name:'Lantern Court',area:'The Lower Boroughs',ambience:'Dusk · a sheltered courtyard',description:'Water pools between the cobblestones. A row of lanterns traces a path from the inn to the covered arcade; above it, the city rises in layers of slate and pale stone.',detail:'The inn door is open behind you. For a moment, the courtyard belongs to the rain.'}};
const threadNames={room:'The whole room',table:'By the hearth',whisper:'A private word',ooc:'Out of character'};
const audience={room:'Visible to the room',table:'Visible to people at the hearth',whisper:'Only you and Mira',ooc:'OOC · visible to the room'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>root.querySelector(s);
const feedback=s=>{$('#arx-feedback').textContent=s;};
function saveDraft(){const box=$('textarea');if(box)state.drafts[state.thread]=box.value;}
function setMoment(value){saveDraft();state.moment=value;opts.moment=value;state.thread='room';state.focus=value==='combat'?'combat':'moment';state.mobile='story';state.detailOpen=false;render();}
function focus(value){saveDraft();state.focus=value;state.detailOpen=true;if(root.clientWidth<=560)state.mobile='details';render();}
function world(){const room=rooms[state.location];return `<div class="arx-eyebrow">Your surroundings</div><h3>${room.name}</h3><p class="arx-small">${room.area}</p><button class="arx-navitem" data-focus="room">Read the room <span style="margin-left:auto">↗</span></button><div class="arx-side-section"><div class="arx-eyebrow">Conversations</div>${state.moment==='lobby'?'<p class="arx-small">Enter the world to find your surroundings.</p>':state.location==='court'?'<p class="arx-small">A quiet moment. No one else is here.</p>':[['room','The whole room','Shared conversation'],['table','By the hearth','A small gathering'],['whisper','A private word','You and Mira']].map(([key,label,sub])=>`<button class="arx-navitem" data-thread="${key}" aria-pressed="${state.thread===key&&['scene','combat'].includes(state.moment)}"><span>${label}<small>${sub}</small></span>${key==='whisper'&&state.thread!=='whisper'?'<span class="arx-count">1</span>':''}</button>`).join('')}</div><div class="arx-side-section"><div class="arx-eyebrow">${state.location==='inn'?'Here with you':'Nearby'}</div>${state.location==='inn'?['Mira','Cassian','Elian'].map((name,i)=>`<button class="arx-person" data-focus="${name}"><span class="arx-avatar">${name[0]}</span><span>${name}<span class="arx-small" style="display:block">${['At the hearth','By the window','At the bar'][i]}</span></span></button>`).join(''):'<p class="arx-small">Light spills from the inn.</p>'}</div><div class="arx-side-section"><div class="arx-eyebrow">Ways onward</div><button class="arx-navitem" data-travel="${state.location==='inn'?'court':'inn'}">${state.location==='inn'?'Lantern Court':'The Gilded Lantern'} <span style="margin-left:auto">→</span></button></div><div class="arx-side-section"><button class="arx-navitem" data-thread="ooc">Out of character</button><button class="arx-navitem" data-focus="boundaries">Scene boundaries</button></div>`;}
function pose(name,time,body,id,sub='To the room'){return `<article class="arx-pose"><div class="arx-author"><span class="arx-avatar">${name[0]}</span><span><button data-focus="${name==='Apostate'?'self':name}">${name}</button><span class="arx-small" style="display:block">${sub}</span></span><time>${time}</time></div><div class="arx-prose">${body}</div><div class="arx-pose-actions"><button data-reply="${name}">Respond</button><button data-applaud="${id}" aria-pressed="${state.applause.has(id)}">${state.applause.has(id)?'Applauded':'Applaud'}</button></div></article>`;}
function feed(){let content='';if(state.thread==='whisper')content=`<div class="arx-divider">Private · you and Mira</div>${pose('Mira','8:34','<p>“There is something I could not say in front of the others. Did anyone follow you here?”</p>','w1','Whisper to Apostate')}`;else if(state.thread==='table')content=`<div class="arx-divider">At the hearth</div>${pose('Mira','8:32','<p>Mira shifts her chair to make room. “Come closer. You look half-frozen.”</p>','t1','To the hearth')}${pose('Elian','8:33','<p>Elian nudges an untouched cup across the table. “You arrived before the story. That is what matters.”</p>','t2','To the hearth')}`;else if(state.thread==='ooc')content=`<div class="arx-divider">Out of character · room participants</div>${pose('Cassian','8:30','<p>I have about an hour tonight. Happy to follow wherever this goes!</p>','o1','OOC')}`;else content=`<div class="arx-divider">${state.moment==='combat'?'The scene continues':'You arrived at the Lantern'}</div>${pose('Mira','8:32','<p>Mira turns at the sound of the door. For a moment, the letter rests forgotten in her hand.</p><p>“You came.” There is relief in her voice, though she tries to hide it. “I was beginning to think the rain had won.”</p>','r1')}${pose('Cassian','8:33','<p>From his seat by the window, Cassian raises his glass in silent greeting. His attention returns to the street a little too quickly.</p>','r2')}${state.moment==='combat'?'<div class="arx-narration"><span class="arx-eyebrow">The scene changes</span><p>The door strikes the wall. A cloaked figure steps inside, blade drawn. Mira backs toward the hearth.</p></div>':'<div class="arx-narration"><span class="arx-eyebrow">The scene around you</span><p>A gust worries the shutters. Conversation softens, then returns beneath the sound of the rain.</p></div>'}`;
if(state.declared&&state.moment==='combat'&&state.thread==='room')content+='<div class="arx-narration"><span class="arx-eyebrow">Your declaration</span><p>'+({guard:'You intend to protect Mira.',retreat:'You intend to withdraw to the doorway.',strike:'You intend to confront the intruder.'}[state.choice])+' Waiting for the round to resolve.</p></div>';
return content+(state.posts[state.thread]||[]).map((post,i)=>pose('Apostate','Now',`<p>${esc(post.text)}</p>`,'mine'+state.thread+i,post.mode==='ooc'?'OOC':audience[state.thread])).join('');}
function center(){const room=rooms[state.location];if(state.moment==='lobby')return `<div class="arx-explore"><div class="arx-eyebrow">Your next chapter</div><h1>Step back<br>into the world.</h1><p class="arx-prose">The city carries on in your absence.<br>Tonight, a door is still open.</p><div class="arx-entry-card"><div class="arx-row"><span class="arx-avatar">A</span><h3>Apostate</h3></div><p>Last location · ${room.name}</p><button class="arx-primary" data-go="explore">Enter as Apostate →</button></div><div class="arx-location-rule"></div><p class="arx-small">You decide where to go and whom to approach.</p></div>`;
if(state.moment==='explore')return `<div class="arx-explore"><div class="arx-eyebrow">${room.area} / You are here</div><h1>${room.name}</h1><p class="arx-small">${room.ambience}</p><div class="arx-location-rule"></div><div class="arx-prose"><p>${room.description}</p><p>${room.detail}</p></div>${state.location==='inn'?'<div class="arx-entry-card"><div class="arx-eyebrow">A gathering · open to join</div><h3>A letter in the rain</h3><p>Mira, Cassian and Elian are here. There is room for another voice.</p><button class="arx-primary" data-go="scene">Approach the gathering →</button></div>':'<div class="arx-entry-card"><h3>A moment to yourself</h3><p>No active scene here. Explore your surroundings or return to the gathering.</p><button class="arx-primary" data-travel="inn">Return to the Lantern →</button></div>'}<div class="arx-detail-block"><div class="arx-eyebrow">Within reach</div><div class="arx-place-list"><button data-focus="${state.location==='inn'?'letter':'lanterns'}">${state.location==='inn'?'A sealed letter':'The lanterns'} <span>Examine ↗</span></button><button data-travel="${state.location==='inn'?'court':'inn'}">${state.location==='inn'?'The open doorway':'The inn doorway'} <span>Go through →</span></button></div></div></div>`;
return `<div class="arx-scene-heading"><div class="arx-row arx-between"><span class="arx-eyebrow">${room.name}</span><span class="arx-tag">${state.moment==='combat'?'Encounter · round 2':'Live scene'}</span></div><h1>A letter in the rain</h1><div class="arx-row arx-between"><span class="arx-small">Four voices · ${state.moment==='combat'?'The stakes have changed':'A chance meeting on a rainy evening'}</span><button class="arx-focus-return arx-small" data-focus="${state.moment==='combat'?'combat':'moment'}">Details ↗</button></div></div><div class="arx-viewbar"><strong>${threadNames[state.thread]}</strong><span style="flex:1"></span><button data-focus="audience">${state.thread==='whisper'?'Private':'Audience'} ↗</button></div><div class="arx-feed" tabindex="0" aria-label="${threadNames[state.thread]} narrative">${feed()}</div><form class="arx-composer"><div class="arx-composer-label"><strong>Writing as Apostate</strong><span class="arx-gold">${audience[state.thread]}</span></div><label for="arx-draft" class="arx-small">${state.thread==='whisper'?'Your private reply':'Your next contribution'}</label><textarea id="arx-draft" placeholder="${state.thread==='whisper'?'Write a private reply to Mira…':'What does Apostate say or do?'}">${esc(state.drafts[state.thread]||'')}</textarea><div class="arx-compose-bottom"><div class="arx-row"><select aria-label="Writing mode"><option value="pose">Roleplay</option><option value="ooc" ${state.mode==='ooc'?'selected':''}>OOC</option></select><button type="button" data-focus="actions">+ Action</button></div><button class="arx-primary" type="submit">${state.thread==='whisper'?'Send to Mira':'Share with '+(state.thread==='table'?'the hearth':'the room')}</button></div></form>`;}
function inspector(){const back='<button class="arx-small" data-close>← Back to the scene</button>';const f=state.focus;
if(f==='self')return `${back}<div class="arx-eyebrow" style="margin-top:16px">Your character</div><h2>Apostate</h2><p class="arx-small">You are at ${rooms[state.location].name}.</p><div class="arx-detail-block"><h3>At a glance</h3><div class="arx-stat"><span>Condition</span><strong>Uninjured</strong></div><div class="arx-stat"><span>Stamina</span><strong>Ready</strong></div><div class="arx-stat"><span>Active effects</span><strong>None</strong></div></div><div class="arx-detail-block"><h3>Your strengths</h3><div class="arx-stat"><span>Composure</span><span>4</span></div><div class="arx-stat"><span>Insight</span><span>3</span></div><div class="arx-stat"><span>Presence</span><span>3</span></div><p class="arx-small" style="margin-top:10px">Illustrative values for this design.</p></div><button class="arx-choice" data-focus="inventory">Carried &amp; worn <small>Travel cloak, signet, folded letter</small></button>`;
if(['Mira','Cassian','Elian'].includes(f))return `${back}<div class="arx-eyebrow" style="margin-top:16px">In focus · a person</div><h2>${f}</h2><p>${{Mira:'A travel-worn coat, ink on her fingers, and the air of someone waiting for an answer.',Cassian:'A watchful guest in a dark waistcoat. Rain beads on the hat beside his glass.',Elian:'Sleeves rolled to the elbow, a warm cup balanced between both hands.'}[f]}</p><div class="arx-detail-block"><h3>What you can see</h3><p class="arx-small">${f==='Mira'?'A letter sealed in dark green wax.':f==='Cassian'?'A signet ring and an untouched glass.':'A plain silver band and a well-mended coat.'}</p></div><button class="arx-primary" data-converse="${f}">${f==='Mira'?'Whisper to Mira':'Address '+f}</button><button class="arx-choice" data-thread="table">Join the hearth conversation</button>`;
if(f==='room')return `${back}<div class="arx-eyebrow" style="margin-top:16px">In focus · a place</div><h2>${rooms[state.location].name}</h2><p>${rooms[state.location].description}</p><div class="arx-detail-block"><h3>Within reach</h3><button class="arx-choice" data-focus="letter">The sealed letter <small>Held by Mira</small></button></div><button class="arx-primary" data-go="explore">Explore this location</button>`;
if(f==='letter'||f==='lanterns')return `${back}<div class="arx-eyebrow" style="margin-top:16px">In focus · an object</div><h2>${f==='letter'?'A sealed letter':'The lanterns'}</h2><p>${f==='letter'?'Heavy cream paper. Dark green wax. The seal bears an unfamiliar branching mark. Mira still holds it; its contents are hidden.':'Small glass lanterns hang beneath the eaves, sheltered from the rain. Warm light catches in the uneven panes.'}</p><div class="arx-detail-block"><h3>Available interactions</h3><button class="arx-choice" data-converse="Mira">${f==='letter'?'Ask Mira about the seal':'Ask Mira about the courtyard'}</button></div>`;
if(f==='audience'||f==='boundaries')return `${back}<div class="arx-eyebrow" style="margin-top:16px">Scene agreements</div><h2>${f==='audience'?'Who can see this?':'Play comfortably'}</h2><p><strong>${audience[state.thread]}.</strong> Public targeting does not make a message private.</p><div class="arx-detail-block"><h3>Recording</h3><p>This scene is provisional. Keeping a record is a separate, explicit decision.</p></div><div class="arx-detail-block"><h3>Boundaries</h3><p>Respect each participant’s lines and veils. Requests needing your answer appear beside your writing.</p></div><button class="arx-choice" data-pause>Request an OOC pause</button>`;
if(f==='journal')return `${back}<div class="arx-eyebrow" style="margin-top:16px">Your journal</div><h2>What you carry forward</h2><p>Kept scenes and your own notes belong here.</p><div class="arx-detail-block"><h3>A letter in the rain</h3><p class="arx-small">In progress · provisional<br>No permanent record has been kept.</p></div><button class="arx-primary" data-go="scene">Return to the live scene</button>`;
if(f==='inventory')return `${back}<div class="arx-eyebrow" style="margin-top:16px">Your belongings</div><h2>Carried &amp; worn</h2><div class="arx-stat"><span>Travel cloak</span><span>Worn</span></div><div class="arx-stat"><span>Signet</span><span>Worn</span></div><div class="arx-stat"><span>Folded letter</span><span>Carried</span></div><p class="arx-small" style="margin-top:16px">Select an object in the world to inspect it without leaving your writing.</p>`;
if(f==='actions')return `${back}<div class="arx-eyebrow" style="margin-top:16px">What do you attempt?</div><h2>Act in the scene</h2><p>Choose an available action, then describe your intent.</p><button class="arx-choice" data-attach="Read the situation">Read the situation<small>Look for meaning in what you can observe.</small></button><button class="arx-choice" data-attach="Examine the seal">Examine the seal<small>Inspect the letter’s visible markings.</small></button><p class="arx-small" style="margin-top:16px">Example actions; the game supplies the available choices and rules.</p>`;
if(state.moment==='combat'||f==='combat')return `${back}<div class="arx-eyebrow" style="margin-top:16px">Encounter · round 2</div><h2>${state.declared?'Intent declared':'What do you do?'}</h2><p class="arx-alert">An intruder threatens the gathering.</p><div class="arx-detail-block"><h3>Positions</h3><div class="arx-map" aria-label="Schematic room positions"><div class="arx-here">Hearth<small>You · Mira</small></div><div>Window<small>Cassian</small></div><div>Doorway<small>Intruder</small></div><div>Bar<small>Elian</small></div></div></div>${state.declared?'<div class="arx-detail-block"><h3>Waiting for resolution</h3><p>Your intent is recorded for this round. Continue writing while the other participants decide.</p></div>':`<div class="arx-detail-block"><div class="arx-eyebrow">Your available actions</div>${[['guard','Protect Mira','Remain by the hearth.'],['retreat','Withdraw','Move toward the doorway.'],['strike','Confront the intruder','Engage the immediate threat.']].map(([key,label,detail])=>`<button class="arx-choice" data-choice="${key}" aria-pressed="${state.choice===key}">${label}<small>${detail}</small></button>`).join('')}<button class="arx-primary" data-declare>Declare intent</button></div>`}<p class="arx-small" style="margin-top:12px">Illustrative choices and positions. Resolution belongs to the game.</p>`;
if(state.moment==='lobby')return '<div class="arx-eyebrow">Welcome back</div><h2>A world of other people.</h2><p>Enter as your character, find a place, and choose a conversation.</p><div class="arx-detail-block"><h3>At your pace</h3><p class="arx-small">You can explore before joining a scene.</p></div>';
if(state.moment==='explore')return `<div class="arx-eyebrow">An invitation, not an obligation</div><h2>${state.location==='inn'?'Follow your curiosity.':'Take your time.'}</h2><p>${state.location==='inn'?'Mira seems preoccupied with the letter. The hearth has an empty chair. The city waits outside.':'There is no scene to join here. The room still has a description, objects, and ways onward.'}</p><div class="arx-detail-block"><h3>Your next move</h3><button class="arx-choice" data-focus="${state.location==='inn'?'Mira':'lanterns'}">${state.location==='inn'?'Look at Mira':'Look at the lanterns'}</button><button class="arx-choice" data-focus="self">Check your character</button></div>`;
return `<div class="arx-eyebrow">This moment</div><h2>A letter.<br>A late arrival.</h2><p>Mira has been waiting for you. Cassian is watching the street.</p><div class="arx-detail-block"><h3>Ways into the scene</h3><button class="arx-choice" data-thread="table">Take a seat by the hearth <small>Join a smaller conversation.</small></button><button class="arx-choice" data-focus="letter">Look at the letter <small>Inspect what is visible.</small></button></div><div class="arx-detail-block"><div class="arx-eyebrow">Your character</div><button class="arx-navitem" data-focus="self"><span>Uninjured · ready<small>Open character details ↗</small></span></button></div><div class="arx-detail-block"><div class="arx-eyebrow">Scene agreements</div><p class="arx-small">Open gathering · provisional record</p><button class="arx-small" data-focus="boundaries">Audience &amp; boundaries ↗</button></div>`;
}
function render(){opts.moment=state.moment;root.dataset.direction=opts.direction;root.dataset.mobile=state.mobile;root.dataset.detailOpen=String(state.detailOpen);root.style.setProperty('--arx-prose-size',opts.proseSize+'px');$('.arx-world').innerHTML=world();$('.arx-center').innerHTML=center();$('.arx-inspector').innerHTML=inspector();root.querySelectorAll('.arx-mainnav [data-go]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.go===state.moment||(b.dataset.go==='scene'&&state.moment==='combat')));root.querySelectorAll('.arx-mobile-nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mobile===state.mobile));}
root.addEventListener('input',e=>{if(e.target.matches('textarea'))state.drafts[state.thread]=e.target.value;});
root.addEventListener('change',e=>{if(e.target.matches('select'))state.mode=e.target.value;});
root.addEventListener('submit',e=>{e.preventDefault();const field=$('textarea');const text=field.value.trim();if(!text){field.focus();feedback('Write something before sharing.');return;}state.posts[state.thread]??=[];state.posts[state.thread].push({text,mode:state.mode});state.drafts[state.thread]='';render();$('.arx-feed').scrollTop=$('.arx-feed').scrollHeight;feedback('Added to this preview only.');});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.go){if(d.go==='scene')state.location='inn';setMoment(d.go);}else if(d.focus)focus(d.focus);else if(d.thread){saveDraft();if(!['scene','combat'].includes(state.moment))state.moment='scene';state.location='inn';state.thread=d.thread;state.mobile='story';state.detailOpen=false;state.mode=d.thread==='ooc'?'ooc':'pose';render();}else if(d.travel){saveDraft();state.location=d.travel;setMoment('explore');feedback('Location changed in the preview. Your writing draft is kept.');}else if(d.mobile){saveDraft();state.mobile=d.mobile;state.detailOpen=d.mobile==='details';render();}else if('close'in d){state.focus=state.moment==='combat'?'combat':'moment';state.mobile='story';state.detailOpen=false;saveDraft();render();}else if(d.converse){saveDraft();state.location='inn';state.moment='scene';state.thread=d.converse==='Mira'?'whisper':'room';state.mobile='story';state.detailOpen=false;if(d.converse!=='Mira')state.drafts.room=`To ${d.converse}: `;render();$('textarea').focus();}else if(d.reply){const field=$('textarea');field.value+=(field.value?'\n':'')+`To ${d.reply}: `;state.drafts[state.thread]=field.value;field.focus();feedback('Recipient added. '+audience[state.thread]+'.');}else if(d.applaud){const active=!state.applause.has(d.applaud);if(active)state.applause.add(d.applaud);else state.applause.delete(d.applaud);b.textContent=active?'Applauded':'Applaud';b.setAttribute('aria-pressed',active);}else if(d.choice){saveDraft();state.choice=d.choice;render();}else if('declare'in d){saveDraft();state.declared=true;render();feedback('Intent declared in the preview; awaiting resolution.');}else if(d.attach){saveDraft();state.drafts[state.thread]=(state.drafts[state.thread]||'')+`[Intent: ${d.attach}] `;state.mobile='story';state.detailOpen=false;state.focus='moment';render();feedback('Illustrative action intent added to your draft.');$('textarea')?.focus();}else if('pause'in d){feedback('Preview: an OOC pause request would be shown to scene participants.');}});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{saveDraft();if(opts.moment!==state.moment){state.moment=opts.moment;state.focus=opts.moment==='combat'?'combat':'moment';state.thread='room';state.location='inn';state.declared=false;state.mobile='story';state.detailOpen=false;}render();}});tweak.addSelect(opts,'direction',{label:'Design direction',options:[{label:'Narrative desk · recommended',value:'editorial'},{label:'Conversation lounge',value:'social'},{label:'Reading room',value:'reading'}]});tweak.addSelect(opts,'moment',{label:'Moment in play',options:[{label:'Entering the world',value:'lobby'},{label:'Exploring a room',value:'explore'},{label:'Roleplaying a scene',value:'scene'},{label:'An encounter begins',value:'combat'}]});tweak.addSlider(opts,'proseSize',{label:'Prose size',min:14,max:20,step:1,unit:'px'});}
})();
</script>

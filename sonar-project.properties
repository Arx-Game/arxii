sonar.projectKey=Arx-Game_arxii
sonar.organization=arx-game

# Source directories
sonar.sources=src,frontend/src

# Exclusions — generated, compiled, infrastructure, and test files.
# Test code is deliberately excluded from ALL analysis (not just CPD): test
# quality is not a gated concern, and SonarCloud Automatic Analysis does not
# honor sonar.cpd.exclusions / sonar.test.inclusions for the new-code
# duplication gate — only sonar.exclusions reliably removes these files. The
# cpd.exclusions block below is retained for any CI scanner-based runs.
sonar.exclusions=\
  **/migrations/**,\
  **/__pycache__/**,\
  **/node_modules/**,\
  **/dist/**,\
  src/web/static/**,\
  src/server/.static/**,\
  src/schema.json,\
  frontend/src/generated/**,\
  tools/**,\
  **/tests/**,\
  **/tests.py,\
  **/test_*.py,\
  **/factories.py,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Test file identification (excluded from coverage denominators, flagged metrics differ)
sonar.tests=src,frontend/src
sonar.test.inclusions=\
  **/tests/**,\
  **/tests.py,\
  **/test_*.py,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Duplication (CPD) exclusions — test code quality is not a gated concern;
# fixtures and mirrored test scaffolding may repeat freely.
sonar.cpd.exclusions=\
  **/tests/**,\
  **/tests.py,\
  **/test_*.py,\
  **/factories.py,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Python — set to 3.13 so type annotations are parsed correctly
sonar.python.version=3.13

# TypeScript
sonar.javascript.file.suffixes=.ts,.tsx

sonar.sourceEncoding=UTF-8

# Rule-scoped ignores do NOT work here — do not add them back.
#
# This project uses SonarCloud Automatic Analysis (sonar.autoscan.enabled = true), which
# reads this file for sonar.exclusions (those DO work) but ignores
# `sonar.issue.ignore.multicriteria` entirely. Three such entries lived here for months,
# each with a careful rationale, while all three rules kept firing on exactly the files
# they named — verified 2026-09-01, see #3548.
#
# Turning a rule off now has two tiers, both declared in `sonar-rules.yaml` at the repo
# root and reconciled by `tools/sonar_profile.py` (CI fails on drift):
#
#   rule-level      -> the custom Quality Profile (sonar-rules.yaml `disabled:`)
#   instance-level  -> a false-positive transition on the issue itself
#                      (sonar-rules.yaml `false_positives:`, applied via
#                       tools/sonarcloud_triage.py)
#
# The three ignores formerly declared here were carried into sonar-rules.yaml with their
# original rationale intact.

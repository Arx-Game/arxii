default_stages: [pre-commit]
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-ast
      - id: check-added-large-files
      # SKILL.md runs these scripts directly, and the main checkout has
      # core.fileMode=false, so a script created there commits as 100644 and
      # fails "permission denied" in every fresh worktree. This reads the mode
      # from the git index, so it catches that even where chmod is ignored.
      - id: check-shebang-scripts-are-executable
        files: ^tools/(skills/.+\.sh|githooks/.+)$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: image-path
        name: Reject images outside approved asset/evidence directories
        entry: uv run python tools/lint_image_paths.py
        language: system
        pass_filenames: true
        files: (?i)\.(avif|bmp|gif|heic|ico|jpe?g|png|svg|tiff?)$
      - id: getattr-literal
        name: Block getattr with literal attribute names
        entry: uv run python tools/lint_getattr_literal.py
        language: system
        pass_filenames: true
        types: [python]
      - id: noqa-ratchet
        name: Ratchet grandfathered noqa suppressions (count may only go down)
        entry: uv run python tools/lint_noqa_ratchet.py
        language: system
        pass_filenames: false
        always_run: true
      - id: prefetch-string
        name: Block bare strings in prefetch_related
        entry: uv run python tools/lint_prefetch_string.py
        language: system
        pass_filenames: true
        types: [python]
      - id: cached-property-import
        name: Forbid functools.cached_property in src/
        entry: uv run python tools/lint_cached_property_import.py
        language: system
        pass_filenames: true
        types: [python]
        files: ^src/
      - id: string-literal
        name: Block bare string literals as identifiers
        entry: uv run python tools/lint_string_literal.py
        language: system
        pass_filenames: true
        types: [python]
        exclude: (tests?[/.]|integration_tests/|^tools/|^scripts/)
      - id: shared-memory
        name: Enforce SharedMemoryModel for concrete models
        entry: uv run python tools/lint_shared_memory.py
        language: system
        pass_filenames: true
        types: [python]
      - id: use-filterset
        name: Enforce FilterSet over query_params in views
        entry: uv run python tools/lint_use_filterset.py
        language: system
        pass_filenames: true
        types: [python]
      - id: template-comment
        name: Reject multi-line {# #} comments in Django templates
        entry: uv run python tools/lint_template_comment.py
        language: system
        pass_filenames: true
        types: [html]
        # Django's `{# #}` is single-line only — the lexer never joins lines, so
        # an opening `{#` whose `#}` is on a later line is not a comment and every
        # character of it renders to the page. Three of these shipped visible
        # comment prose into the production admin index, the FormTraitOption
        # change list and the tuning economy panel. `{% comment %}` spans lines.
      - id: identifier-dashes
        name: Reject em-dashes in names, keys and slugs (lookup bug)
        entry: uv run python tools/lint_identifier_dashes.py
        language: system
        pass_filenames: true
        types_or: [python, json]
        # Ruled 2026-08-03 (Tehom): "we should NOT have em dashes in natural
        # keys/names ever ... a search by keyboard wouldn't match them because
        # people are entering a hyphen and it's an em-dash."
        #
        # NOT the prose/AI-voice rule; that one lives in the deslop skill and is
        # softer. This is correctness: a name IS a lookup key here (the dominant
        # pattern is an exact `Model.objects.get(name=...)`), so a name carrying
        # a character no keyboard produces is a row nobody can find, and
        # `get_or_create` on the hyphenated spelling silently makes a DUPLICATE.
        #
        # Repo-wide from day one rather than rolled out app-by-app like
        # objectdb-param: the whole codebase already passes, so there is no debt
        # to phase in, and the failure mode is silent in both directions.
        # Suppress a genuine external key with `# noqa: IDENT_DASH` plus a reason.
      # str-exc-response: django_notes.md's ViewSet standards say never put
      # str(exc) in a response, and CodeQL flags the same shape as
      # py/stack-trace-exposure. Nothing enforced it until #3787 shipped one to
      # the point of enqueue. Scoped to world's API surface, which passes clean;
      # web/admin/ carries 15 pre-existing instances on staff-only surfaces and
      # is the next scope expansion, same phase-in pattern as objectdb-param.
      - id: str-exc-response
        name: Reject str(exc) on a caught exception in views and serializers
        entry: uv run python tools/lint_str_exc_response.py
        language: system
        pass_filenames: true
        types: [python]
        files: ^src/world/.*(views|serializers)\.py$
      - id: objectdb-param
        name: Reject ObjectDB-typed args and model FKs
        entry: uv run python tools/lint_objectdb_param.py
        language: system
        pass_filenames: true
        types: [python]
        # Phase 1 + 2 scope: vitals + magic capability_requirements +
        # conditions/services.py. Phase 3 expansion (#727 Phase 6): the
        # npc_services service-function signatures were retyped from
        # ObjectDB to the Character typeclass, so the module is now in
        # scope. Future PRs continue to expand this regex one app at a
        # time as their service modules are triaged. See CLAUDE.md "Avoid
        # direct FKs to ObjectDB" for the OBJECTDB_PARAM noqa token and
        # rollout policy.
        #
        # #2608 tranche 3: the linter now also flags model relation fields
        # pointing at ObjectDB (OBJECTDB_FIELD). The models.py files below are
        # the ones whose relation fields are fully triaged — every remaining
        # ObjectDB field in them carries a `noqa: OBJECTDB_FIELD` rationale, so
        # they cannot regress. Add an app's models.py here as its fields are
        # triaged; scenes/models.py joins once Scene.location is retargeted.
        files: |
          (?x)^src/world/(
            vitals/services\.py
            |magic/services/capability_requirements\.py
            |conditions/services\.py
            |npc_services/services\.py
            |dreams/models\.py
            |instances/models\.py
            |captivity/models\.py
            |gm/models\.py
            |character_creation/models\.py
            |mechanics/models\.py
          )$
      - id: lint-idmapper-mutation-order
        name: Reject mutate-then-save-then-raise inside an atomic block
        entry: uv run python tools/lint_idmapper_mutation_order.py
        language: system
        pass_filenames: true
        types: [python]
        files: ^src/world/
        # Apostate ruling 7 (2026-08-27): a raise after mutate-then-save on a
        # SharedMemoryModel instance inside transaction.atomic() rolls back the
        # DB row but not the cached identity-map instance, poisoning it for the
        # process lifetime. Convention + narrow lint, deliberately no rollback
        # hook — see django_notes.md's "Idmapper Rollback Staleness" section and
        # ADR-0008's addendum. Repo-wide within src/world/ from day one (the
        # shape is narrow enough not to need the expand-one-app-at-a-time
        # rollout objectdb-param uses). Suppress with
        # `# noqa: IDMAPPER_MUTATE_ORDER` plus a stated reason.
      - id: lint-only-defer
        name: Reject .only()/.defer() on identity-mapped models
        entry: uv run python tools/lint_only_defer.py
        language: system
        pass_filenames: true
        types: [python]
        files: ^src/
        # Sentry ARX2-9 (2026-09-03): the idmapper hands back the resident
        # instance for a pk and never refreshes its columns, so a row whose
        # first load went through .only()/.defer() stays narrowed for the
        # process and the next full read raises KeyError from Django's
        # deferred-attribute getter. Nothing is saved by narrowing a row the
        # identity map loads once. See ADR-0261 and django_notes.md. Suppress
        # with `# noqa: IDMAPPER_ONLY` plus a reason, only for a model that is
        # not a SharedMemoryModel.
      - id: prefetch-to-attr
        name: Reject to_attr prefetches unless PrunedCachedProperty-backed
        entry: uv run python tools/lint_prefetch_to_attr.py
        language: system
        pass_filenames: true
        types: [python]
        files: ^src/(evennia_extensions|web/admin/upbringing_builder)/.*\.py$
        # #3673 / ADR-0263, narrowed by #3816: `Prefetch(..., to_attr=...)` writes
        # a plain attribute, and Django skips a prefetch that already has one -
        # correct only for a genuine data descriptor, silently wrong for a bare
        # attribute or plain `@property`/`cached_property`, which always look
        # "already set". Under the identity map that makes the second request
        # re-serve the first request's rows - deleted ones included, arriving
        # with a null id. `PrunedCachedProperty` (evennia_extensions/cached_property.py)
        # is the sanctioned target: a real data descriptor that also self-heals
        # against pk-nulled zombie rows on every read (ADR-0296). The hook allows
        # `to_attr` only onto a same-file `PrunedCachedProperty`-decorated property
        # of the matching name; everything else still fails. Derived views
        # filter a prefetched raw list in Python. `CachedRowsHandler` and its
        # former `CompanionOrderHandler` consumer were removed by #3835.
        #
        # THIS SCOPE HAS ZERO ENFORCEMENT FOOTPRINT TODAY: neither
        # evennia_extensions/ nor web/admin/upbringing_builder/ contains a single
        # `to_attr` call site (only prose mentions), so a clean run here is not
        # evidence the rewritten check works against real code - it is only
        # evidence it doesn't false-positive on these two directories.
        #
        # SCOPE WIDENS ONE APP AT A TIME, and this regex lists only the surfaces
        # that are actually clean under the rule above. #3816's plan converted
        # specific named properties in world/scenes, world/journals,
        # world/character_sheets, world/character_creation, world/magic and
        # world/combat, but `--all-files` against those six trees under the new
        # logic finds 106 unsanctioned `to_attr` sites, split two ways (counted
        # by cross-referencing every flagged `to_attr` string against every
        # `PrunedCachedProperty`-decorated name repo-wide, see #3835):
        #   - ~84 are genuinely unconverted - out of this plan's scope entirely,
        #     e.g. `ComboDefinition.cached_slots` in world/combat/services.py has
        #     no backing descriptor at all; `cached_codex_grants` in
        #     world/character_creation/models.py is a deliberate plain
        #     `cached_property` for negligible-staleness authored content, not a
        #     bug.
        #   - ~22 are FALSE POSITIVES from this hook's own same-file heuristic -
        #     a genuine `PrunedCachedProperty` exists, but in a different file
        #     than the `Prefetch` call, which the heuristic cannot see across.
        #     This includes all 14 flags in world/scenes/interaction_views.py -
        #     this plan's own flagship conversion, already correct - because the
        #     descriptors live in world/scenes/models.py. Splitting the
        #     `Prefetch` call from the property definition across files is the
        #     DOMINANT, correct layout in this codebase, not an edge case.
        # Converting the ~84 genuine sites alone would never turn this hook green
        # against those six trees - the ~22 cross-file false positives need
        # EITHER a per-site `# noqa: PREFETCH_TO_ATTR` suppression, OR a genuine
        # cross-file resolution enhancement to this hook. Widening now would
        # break pre-commit for the next unrelated edit to any of those files.
        # Everywhere outside this regex is held by the repo-wide
        # `pattern:PREFETCH_TO_ATTR` ratchet in tools/noqa_ratchet_baseline.txt
        # (count may only go down), so a NEW to_attr fails anywhere in src/
        # regardless - this hook is the one that also says what to build
        # instead. #3835 is the filed home for auditing the ~84 genuine sites
        # and deciding the false-positive fix; an app joins this regex once
        # that audit lands, not before.
      - id: view-memo
        name: Reject per-request memos on views and serializers
        entry: uv run python tools/lint_view_memo.py
        language: system
        pass_filenames: true
        types: [python]
        files: ^src/.*(/(views|serializers)/.*|(views|serializers)[^/]*)\.py$
        # #3597 / ADR-0260 (2026-09-03): a `_thing: T | None = None` class
        # attribute filled during a request is a memo the ruling rejects, and so is
        # the lazy `hasattr(self, "_thing")` / `self._thing = ...` spelling of it
        # inside a method. Account data is a cached_property on the Account
        # typeclass; request data is an explicit argument (serializer `context=`,
        # or `validated_data`) or middleware. Suppress with `# noqa: VIEW_MEMO`
        # plus a reason, only for constant configuration that defaults to None.
      - id: undelivered-interaction
        name: Reject a persisted Interaction with no live delivery seam
        entry: uv run python tools/lint_undelivered_interaction.py
        language: system
        pass_filenames: true
        types: [python]
        files: ^src/.*\.py$
        exclude: (/tests/|/migrations/)
        # #3807 (2026-09-13): three production writers persisted an Interaction row,
        # wrote its target rows, and returned - no WebSocket push, no telnet line, to
        # anybody, ever (`_create_result_interaction` / `_resolve_treatment_request` in
        # `world/scenes/action_services.py`, `create_cast_outcome_pose` in
        # `world/scenes/cast_services.py`). Every other production
        # `create_interaction` caller delivers its row through a push seam
        # (`push_interaction`, `deliver_outcome_interaction`,
        # `push_ephemeral_interaction`, `_send_to_objects`, `_broadcast_to_location`)
        # in the same or an enclosing function; this hook enforces that pairing.
        # Suppress with `# noqa: UNDELIVERED` plus a reason - the only one found in
        # this codebase is that the function returns the row to a caller that
        # delivers it itself (`world/magic/audere_majora.py`'s `_post_declaration`,
        # whose row `cross_threshold` pushes after finishing the crossing).
      - id: check-migrations
        name: Check Django migrations
        entry: uv run python tools/check_migrations.py
        language: system
        pass_filenames: false
      - id: shard-coverage
        name: Enforce CI shard coverage for every backend app
        entry: uv run python tools/lint_shard_coverage.py
        language: system
        pass_filenames: false
      - id: check-migration-seed-data
        name: Check for seed data in migrations
        entry: uv run python tools/check_migration_seed_data.py
        language: system
        pass_filenames: false
      - id: migration-ddl-dml
        name: Keep schema and data operations in separate migrations
        entry: uv run python tools/lint_migration_ddl_dml.py
        language: system
        pass_filenames: false
        # A migration runs in one transaction. PostgreSQL queues a deferred FK
        # trigger event per row written and refuses ALTER TABLE while any are
        # pending, so a RunPython followed by a schema operation aborts with
        # "cannot ALTER TABLE ... because it has pending trigger events". It
        # passes CI, where the data operation touches no rows, and fails on the
        # production converge (0220_upbringings, 2026-09-04). Split them:
        # expand, migrate, contract. See ADR-0237.
      - id: migration-constraint-on-new-column
        name: No CHECK constraint pairing a column added in the same migration with an old one
        entry: uv run python tools/lint_migration_constraint_on_new_column.py
        language: system
        pass_filenames: false
        # AddField(null=True) leaves every existing row NULL; a CHECK that ties
        # that column to one that already existed ("both null or both set") is
        # violated by every row with the old column set, and PostgreSQL checks
        # the whole table at ADD CONSTRAINT. Passes CI (no rows), failed the
        # production converge (0149_partitioned_metadata_integrity, 2026-09-24).
        # Expand, backfill, contract: column, data migration, then constraint.
      - id: check-partition-sql-drift
        name: Detect drift between Interaction model and partition SQL
        entry: uv run python tools/check_partition_sql_drift.py
        language: system
        pass_filenames: false
        files: ^(src/world/scenes/(models\.py|sql/partition_interaction_.*\.sql))$
      - id: lint-migration-generations
        name: No migration reuses or depends on an earlier generation's name (ADR-0276)
        entry: uv run python tools/lint_migration_generations.py
        language: system
        pass_filenames: false
        files: ^src/world/migrations/.*\.py$
      - id: standalone-sql-wiring
        name: Enforce standalone SQL is wired into both schema paths
        entry: uv run python tools/check_standalone_sql_wiring.py
        language: system
        pass_filenames: false
      # tools/tests/ is pytest, not Django, so `arx test`'s app labels never
      # reach it and nothing else in CI ran it - the unit tests guarding
      # compare_schemas.py, check_standalone_sql_wiring.py and the sonarcloud
      # helpers were inert (found while fixing #3544, whose own regression pins
      # live there). Whole suite is ~6s, so it runs on every commit.
      - id: tools-tests
        name: Unit tests for tools/ helper scripts
        entry: uv run pytest tools/tests -q
        language: system
        pass_filenames: false
        files: ^tools/
      - id: ty
        name: ty
        entry: uv run ty check --no-progress
        language: system
        pass_filenames: false
      - id: check-type-annotations
        name: Enforce type annotations in typed apps
        entry: uv run python tools/check_type_annotations.py
        language: system
        pass_filenames: false
      - id: mock-cast
        name: Reject Record<string, any> for hook mocks in test files
        entry: uv run python tools/check_mock_cast.py
        language: system
        pass_filenames: true
        files: ^frontend/.*\.test\.(ts|tsx)$
      - id: shellcheck-skills
        name: shellcheck tools/skills and tools/githooks bash scripts
        entry: shellcheck
        language: system
        files: ^tools/(skills/.+\.sh|githooks/.+)$
        pass_filenames: true
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: bash
        args:
          - -c
          - |
            cd frontend
            cleaned=()
            for file in "$@"; do
              cleaned+=("${file#frontend/}")
            done
            pnpm exec eslint "${cleaned[@]}"
        language: system
        pass_filenames: true
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        # One eslint process for the whole staged list. Without this pre-commit
        # splits the list into batches of max(4, n/cpu_count) files and runs one
        # eslint per batch at once; each peaks near 275 MB, so a merge from main
        # staging 64 frontend files on a 16-CPU/4 GiB devcontainer spawned 16 of
        # them and the OOM killer took the whole session, four times on
        # 2026-09-23. Same fix as `typescript` below (#3707).
        require_serial: true
      - id: typescript
        name: TypeScript Check
        entry: bash
        args:
          - -c
          - |
            cd frontend
            pnpm typecheck
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        # A whole-project check that never reads the filenames it is handed. Without
        # these two lines pre-commit splits a long staged list into batches and runs
        # the hook once per batch, concurrently: five `tsc -b --noEmit` at ~1.3 GB
        # each on a 4 GiB devcontainer, killed at exit 137 (#3707).
        pass_filenames: false
        require_serial: true
      - id: prettier
        name: Prettier
        entry: bash
        args:
          - -c
          - |
              cd frontend
              cleaned=()
              for file in "$@"; do
                cleaned+=("${file#frontend/}")
              done
              pnpm exec prettier --write --ignore-unknown "${cleaned[@]}"
          - ""
        language: system
        pass_filenames: true
        files: ^frontend/
        # Same batching hazard as eslint above: one node process per commit.
        require_serial: true

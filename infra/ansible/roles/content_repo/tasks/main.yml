---
# Provisions the private lore-repo checkout the app's own content pipeline
# (src/core_management/content_repo.py) already knows how to consume via
# CONTENT_REPO_PATH — see docs/systems/content-authoring.md. This role does
# NOT load content into the database; that stays the admin "Load private
# content repo" button, a deliberate human gate (ADR-0201 credited-row
# freeze). It only gets the checkout + env var onto the box.

# Fail-closed, mirroring roles/secrets_vault/tasks/main.yml's own two-step
# pattern (collect missing NAMES ONLY under no_log, then assert without
# no_log so the failure message actually names which var is missing):
# ARXII_CONTENT_REPO_TOKEN/ARXII_CONTENT_REPO are read directly via
# lookup('env', ...) below, same convention as every other ARXII_* secret
# in this codebase (see the Interfaces note in this role's own brief). An
# empty/unset value here would otherwise silently produce either a
# malformed clone URL (`https://github.com/.git`, ARXII_CONTENT_REPO empty)
# or a malformed Authorization header (ARXII_CONTENT_REPO_TOKEN empty) —
# and because the clone task below carries no_log: true, git's own error
# output would be suppressed too, leaving the operator with an opaque
# failure and no diagnostic. Plausible before Task 2 wires these into
# standup.sh, or if a rotated/typo'd token ever goes missing in prod.
- name: Collect names of missing content-repo env vars (values never logged)
  ansible.builtin.set_fact:
    content_repo_missing_env: >-
      {{ (content_repo_missing_env | default([])) +
         ([item] if (lookup('env', item) | length == 0) else []) }}
  loop:
    - ARXII_CONTENT_REPO_TOKEN
    - ARXII_CONTENT_REPO
  no_log: true

- name: Fail-closed — ARXII_CONTENT_REPO_TOKEN/ARXII_CONTENT_REPO must be present & non-empty
  ansible.builtin.assert:
    that:
      - (content_repo_missing_env | default([])) | length == 0
    fail_msg: >-
      Required content-repo env var(s) missing/empty: {{
      content_repo_missing_env | default([]) | join(', ') }} (set from the
      gated GitHub Environment / password manager; wired by Task 2's
      standup.yml/standup.sh).
    quiet: true

# ansible.builtin.git creates dest itself on clone, so no separate
# parent-dir-creation task is needed here — the base role's "Lock down the
# app root" task already owns /opt/arxii's own directory permissions
# (0750 arxii:arxii); this role would otherwise silently duplicate that
# ownership with a second, drift-prone source of truth for the same path.

# HTTPS + a credential passed via git's own environment-variable config
# mechanism (GIT_CONFIG_COUNT/GIT_CONFIG_KEY_n/GIT_CONFIG_VALUE_n, git
# >=2.31 — this box targets Ubuntu 24.04 "noble", which ships far newer) —
# not an SSH deploy key, and not a credential embedded in the `repo:` URL.
# Ansible's environment: task keyword sets these for the task's subprocess
# only; ansible.builtin.git shells out to the real git binary, so it
# inherits them. This is the same header-injection technique GitHub's own
# docs recommend for token auth without touching .git/config or the remote
# URL — the token is never written to any file, not even transiently: it
# lives only in that one subprocess's environment for the duration of the
# clone/pull. Because `repo:` is therefore always the same clean URL, this
# task's no_log: true is defense in depth, not strictly load-bearing (the
# credential really is only in the header value below); ARXII_CONTENT_REPO
# (owner/repo slug, non-secret Variable) keeps the slug out of infra
# config, resolved only via the gated Environment Variable (see
# docs/systems/content-authoring.md's "One-time setup" section — that
# principle is about the session-PR push flow parsing `origin`, not this
# role, but the same discipline applies here); ARXII_CONTENT_REPO_TOKEN
# (Secret, fine-grained PAT, Contents:Read-only) is what actually grants
# access. Runs every converge (idempotent via ansible.builtin.git's own
# change detection, comparing `git remote get-url origin` against the
# always-clean `repo:` value — no separate scrub step needed, and no
# permanent `changed=1` drift): standup.yml is also the button used for
# ordinary redeploys, not just first boot, so a merged lore PR reaches the
# box automatically by the next deploy.
#
# Wrapped in block/rescue because an unhandled failure here is an opaque,
# no_log-censored MODULE FAILURE with no diagnostic. Three real causes: (1)
# prod-admin content authoring writes into this same checkout
# (resolve_content_root() in src/core_management/content_repo.py is the
# same path several admin views export content into), and
# ansible.builtin.git defaults to force: no, so it refuses to clone/pull
# over local modifications — do NOT set force: true to "fix" this, it would
# silently destroy uncommitted prod-admin authoring work, which is worse
# than a loud failure; (2) an expired/revoked PAT — operators are told to
# set an expiration with a manual rotation reminder (see infra/README.md),
# so this will happen eventually; (3) a wrong ARXII_CONTENT_REPO slug or a
# token missing Contents:Read permission.
- name: Clone/update the private lore-repo checkout (credential via env, never the URL or disk)
  block:
    - name: Clone/update the private lore-repo checkout (credential via env, never the URL or disk)
      ansible.builtin.git:
        repo: "https://github.com/{{ lookup('env', 'ARXII_CONTENT_REPO') }}.git"
        dest: "{{ content_repo_path }}"
        version: main
      become: true
      become_user: "{{ app_user }}"
      environment:
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: "http.https://github.com/.extraheader"
        GIT_CONFIG_VALUE_0: "AUTHORIZATION: basic {{ ('x-access-token:' + lookup('env', 'ARXII_CONTENT_REPO_TOKEN')) | b64encode }}"
      no_log: true
      register: content_repo_checkout
  rescue:
    - name: Fail with a diagnosable message (the block above is no_log; this is not)
      ansible.builtin.fail:
        msg: >-
          content_repo checkout failed. Likely causes: (1) local
          modifications exist in {{ content_repo_path }} from prod-admin
          content authoring (uncommitted export output blocks the next
          deploy's refresh) — commit or discard them before the next
          deploy; (2) ARXII_CONTENT_REPO_TOKEN is expired, revoked, or
          lacks Contents:Read on the repo; (3) ARXII_CONTENT_REPO does not
          name the correct owner/repo slug.

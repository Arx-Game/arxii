---
base_service_user: arxii
base_service_group: arxii
base_app_root: /opt/arxii
# Box hostname. Ubuntu images boot as `localhost` unless something sets one,
# and until now nothing did — which is what made every production Sentry
# event carry `server_name: localhost` (sentry_sdk falls back to
# socket.gethostname() when no server_name is passed).
#
# Derived from the inventory host key, so it needs no operator decision and
# a second host gets a distinct name for free: standup.sh's gen_inventory
# writes `prod`, rehearse.sh writes `stage` (see lib.sh), giving arxii-prod
# and arxii-stage. Hyphen, never an en/em-dash — this is a name that gets
# looked up.
base_hostname: "arxii-{{ inventory_hostname }}"
# Game cgroup memory cap (the game service runs in this slice). A leak gets
# the slice OOM-killed/restarted instead of taking the box (and Postgres)
# down — Postgres is isolated separately in its own role.
base_game_memory_max: "1500M"
base_packages:
  - acl            # required for Ansible become-as-unprivileged-user (setfacl)
  - ca-certificates
  - curl
  - git            # used by app_deploy to check out the release
  - python3

# uv (Astral) is arxii's Python project + venv manager. We install the
# upstream standalone binary at a pinned version with SHA verification
# (the apt repos do not yet ship uv). To bump: change both values together;
# the SHA is the x86_64-unknown-linux-gnu tarball SHA256 from the release's
# published checksums.
base_uv_version: "0.11.15"
base_uv_sha256: "b03e572f010bea94a4a52d42671ba72981e12894f71576181a1d26ff68546da7"
base_uv_bin: /usr/local/bin/uv
# AWS CLI v2, pinned + sha256-verified, same idiom as uv above. Ubuntu 24.04
# dropped the `awscli` package from the archive entirely (universe included),
# so apt cannot supply it: `apt-cache policy awscli` reports no candidate even
# after an update. The backups and offsite_replication roles both need the
# `aws` command, and it appears in 11 places across those roles' templates and
# infra/scripts (restore.sh and pull_prod_db.sh included), so switching tools
# would mean rewriting the restore path. Installed here in base rather than in
# either role, so there is one pinned copy instead of two.
# The versioned URL is byte-identical to the floating "latest" one; pin the
# version so a new upstream release cannot change what we install.
base_awscli_version: "2.36.24"
base_awscli_sha256: "18a0807c25cb5b1737c652c554ab40404f6928dac677e1e263bbc19e16acd2fa"
base_awscli_bin: /usr/local/bin/aws

---
# Fail-closed FIRST — nothing below is safe to run without a real admin key:
# ssh_hardening (later in site.yml) disables root login, so if this list is
# empty we'd converge toward a host nobody can reach.
- name: Fail-closed — admin_authorized_keys must be supplied
  ansible.builtin.assert:
    that:
      - admin_authorized_keys is defined
      - (admin_authorized_keys | length) > 0
    fail_msg: >-
      admin_authorized_keys is empty/undefined — group_vars not generated —
      run via standup.sh.
    quiet: true

# SSH admin login user — BEFORE anything else that could fail. First
# converge connects as root (Linode injects the key there); this creates
# the user ansible reconnects as on every later run.
- name: Create the arxadmin login user (sudo, key-only)
  ansible.builtin.user:
    name: arxadmin
    shell: /bin/bash
    groups: sudo
    create_home: true

- name: Grant arxadmin passwordless sudo (validated to avoid a bad sudoers file)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/arxadmin
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
    content: |
      # Managed by Ansible (base). Needed because ansible reconnects as
      # arxadmin with become after ssh_hardening disables root login.
      arxadmin ALL=(ALL) NOPASSWD:ALL

- name: Authorize admin SSH keys for arxadmin
  ansible.posix.authorized_key:
    user: arxadmin
    key: "{{ item }}"
  loop: "{{ admin_authorized_keys }}"

- name: Ensure service group exists
  ansible.builtin.group:
    name: "{{ base_service_group }}"
    system: true

- name: Ensure non-root service user exists (no login shell)
  ansible.builtin.user:
    name: "{{ base_service_user }}"
    group: "{{ base_service_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ base_app_root }}"
    create_home: true

# 0751, not 0750: Caddy runs as its own `caddy` user and serves /static/* off
# disk from under this tree, so it needs to *traverse* here. The execute bit
# for "other" grants exactly that and nothing else — the directory still cannot
# be listed, and every file keeps its own mode. The static assets Caddy serves
# are already world-readable (0644); the secrets under here are not
# (secret_settings.py is 0640 arxii:arxii, the EnvironmentFile 0600), so they
# stay unreadable to Caddy.
#
# The alternative — adding `caddy` to the `arxii` group — was rejected: group
# membership would make that 0640 secret_settings.py readable by the web
# server, handing it SECRET_KEY, the database password and the Resend key.
# Traversal is the smaller grant. Without it the frontend serves a blank page,
# because index.html comes from Django through the reverse proxy while every
# dist/assets bundle 403s from Caddy's file_server.
- name: Lock down the app root (0751 so Caddy can traverse to /static)
  ansible.builtin.file:
    path: "{{ base_app_root }}"
    state: directory
    owner: "{{ base_service_user }}"
    group: "{{ base_service_group }}"
    mode: "0751"

# Waits out first-boot provisioning so the apt lock isn't held by
# apt-daily/apt-daily-upgrade on a fresh image; tolerated if cloud-init
# is absent (non-Linode/test hosts).
- name: Wait for cloud-init to finish (avoids racing the apt lock)
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  failed_when: false

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600

# Install uv (Python project / venv manager). Pinned version + SHA verified.
# Idempotent: if the binary already reports the pinned version, the install
# block is skipped entirely (no redundant downloads on every deploy).
- name: Check installed uv version (if present)
  ansible.builtin.command: "{{ base_uv_bin }} --version"
  register: base_uv_check
  changed_when: false
  failed_when: false

- name: Install uv (pinned + sha256-verified standalone binary)
  when: "base_uv_version not in (base_uv_check.stdout | default(''))"
  block:
    - name: Download uv tarball
      ansible.builtin.get_url:
        url: "https://github.com/astral-sh/uv/releases/download/{{ base_uv_version }}/uv-x86_64-unknown-linux-gnu.tar.gz"
        dest: "/tmp/uv-{{ base_uv_version }}.tar.gz"
        checksum: "sha256:{{ base_uv_sha256 }}"
        mode: "0644"

    - name: Extract uv tarball
      ansible.builtin.unarchive:
        src: "/tmp/uv-{{ base_uv_version }}.tar.gz"
        dest: /tmp/
        remote_src: true

    - name: Install uv to {{ base_uv_bin }}
      ansible.builtin.copy:
        src: /tmp/uv-x86_64-unknown-linux-gnu/uv
        dest: "{{ base_uv_bin }}"
        owner: root
        group: root
        mode: "0755"
        remote_src: true

# AWS CLI v2. Pinned version + SHA verified, same idiom as uv above, and
# idempotent the same way: if the binary already reports the pinned version,
# the block is skipped and nothing is downloaded.
#
# This lives in base, not in backups/offsite_replication, because both of those
# roles need the `aws` command and neither should own a second copy of the
# install. Ubuntu 24.04 removed `awscli` from the archive, so apt cannot supply
# it at all -- the 2026-08-15 standup failed here with "No package matching
# 'awscli' is available" after universe was already enabled.
- name: Check installed AWS CLI version (if present)
  ansible.builtin.command: "{{ base_awscli_bin }} --version"
  register: base_awscli_check
  changed_when: false
  failed_when: false

- name: Install AWS CLI v2 (pinned + sha256-verified official bundle)
  when: "base_awscli_version not in (base_awscli_check.stdout | default(''))"
  block:
    - name: Ensure unzip is present (AWS ships the installer as a zip)
      ansible.builtin.apt:
        name: unzip
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 600

    - name: Download the AWS CLI v2 bundle
      ansible.builtin.get_url:
        url: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-{{ base_awscli_version }}.zip"
        dest: "/tmp/awscli-{{ base_awscli_version }}.zip"
        checksum: "sha256:{{ base_awscli_sha256 }}"
        mode: "0644"

    - name: Extract the AWS CLI v2 bundle
      ansible.builtin.unarchive:
        src: "/tmp/awscli-{{ base_awscli_version }}.zip"
        dest: /tmp/
        remote_src: true

    - name: Run AWS's own installer (writes {{ base_awscli_bin }})
      # --update so a version bump replaces the existing /usr/local/aws-cli
      # tree in place; without it the installer refuses when one is present.
      ansible.builtin.command: /tmp/aws/install --update
      changed_when: true

- name: Keep the host clock disciplined (TOTP codes fail site-wide past 30s of drift, issue 3591)
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started

- name: Create the game cgroup slice (MemoryMax isolates a leak from the box)
  ansible.builtin.copy:
    dest: /etc/systemd/system/arxii.slice
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Arx II game slice (memory-isolated from host and Postgres)
      Before=slices.target

      [Slice]
      MemoryAccounting=yes
      MemoryMax={{ base_game_memory_max }}
  notify: Reload systemd

- name: Flush handlers so the slice is active before later roles use it
  ansible.builtin.meta: flush_handlers

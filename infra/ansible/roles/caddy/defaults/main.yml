---
# Where apt installs the binary, and where the plugin-carrying rebuild is
# staged before it is renamed over that path. Both are overridable so a
# different image layout does not need a task edit.
caddy_bin: /usr/bin/caddy
caddy_staged_bin: /tmp/caddy-with-cloudflare
# Caddy's OWN EnvironmentFile, holding only CADDY_CF_DNS_TOKEN. Deliberately
# not secrets_vault's /etc/arxii/arxii.env: that one is arxii:arxii 0640
# inside a 0750 dir, unreadable by the caddy user, and it carries every app
# secret — Caddy has no business seeing the database password.
caddy_env_file: /etc/caddy/caddy.env
# Caddy's build service names architectures the Go way; Ansible reports the
# uname spelling. Only the two we could plausibly run on are mapped, and an
# unmapped value fails loudly at template time rather than downloading a
# binary for the wrong architecture.
caddy_download_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] }}"
caddy_web_fqdn: "play.example"          # = tofu output web_fqdn
caddy_backend: "127.0.0.1:4001"         # localhost-bound Django/web app backend
# Evennia portal websocket, localhost-bound. Templated into the Caddyfile's
# @ws route exactly like caddy_backend above (a single whole-address token,
# not "host:{{ var }}" split across a literal host and a templated port) —
# CI's validate.yml stubs every WHOLE `{{ ... }}` substitution with a
# unique placeholder hostname (`placeholderN.example.com`) before running
# `caddy adapt`, and a bare hostname is itself a valid reverse_proxy
# upstream (no port = Caddy's default), so this form survives that stub. The old
# "port-only var, hardcoded host" split would NOT have survived it (that's
# why it used to be informational-only) — keep this as a whole address.
caddy_ws_backend: "127.0.0.1:4002"
# STATIC_ROOT (verified against src/server/conf/settings.py + Evennia's
# settings_default.py: STATIC_ROOT = GAME_DIR/server/.static, GAME_DIR =
# os.getcwd() when Django commands run from src/). app_deploy's collectstatic
# populates this under the `current` symlink.
caddy_static_root: "/opt/arxii/current/src/server/.static"
# ACME behind Cloudflare proxy needs DNS-01 (HTTP-01 is intercepted by the
# orange-cloud). DNS-01 requires Caddy BUILT WITH the caddy-dns/cloudflare
# plugin (added idempotently by tasks/main.yml, which fetches the matching
# Caddy version rebuilt with that module from Caddy's build service) and a
# DNS-edit-scoped Cloudflare token supplied via env (CADDY_CF_DNS_TOKEN),
# which is a NEW on-box secret to add to the gated-Environment contract.
caddy_acme_email: "ops@example"
# --- Arx I static archive (docs/operations/arx1-archival.md) ----------------
# The archive is served BY THE WEB VHOST, at the literal path /arxmush-archive
# (#3320, ADR-0232), behind a forward_auth subrequest to Django's
# /api/arx1-archive/authorize/ - Arx II accounts instead of the shared
# basic-auth password ADR-0225 shipped with. It is a path rather than a
# subdomain so the session cookie reaches it with SESSION_COOKIE_DOMAIN left
# unset (a widened cookie would go to EVERY future subdomain).
#
# The prefix is a literal in the Caddyfile template, not a var: CI's
# validate.yml stubs every `{{ ... }}` with a placeholder hostname, and a path
# matcher must start with "/". roles/arx1_archive rewrites the exported HTML's
# root-relative links to the same literal; acceptance.sh asserts they agree.
#
# NOTE: consume the enabled flags with `| bool` - the folded expressions
# render to the STRING "True"/"False", and a bare `{% if %}` on a non-empty
# string is always truthy.
caddy_archive_root: /srv/arx1-archive
# Mount the archive path blocks. Prod-only: the stage box holds no archive
# content and the export is prod-adjacent, by the isolation doctrine.
caddy_archive_enabled: >-
  {{ not caddy_rehearsal_mode }}
# The old archive.<domain> vhost, reduced to a 301 onto the path above so
# links already handed out keep working. Rendered only once the fqdn is wired
# (standup.sh writes it from `tofu output archive_fqdn`); an empty fqdn means
# "the subdomain was never rolled out", which needs no redirect.
caddy_archive_fqdn: "" # = tofu output archive_fqdn (via generated group_vars)
caddy_archive_redirect_enabled: >-
  {{ (not caddy_rehearsal_mode)
     and (caddy_archive_fqdn | length > 0) }}

# #2236 Phase 3 P1 (dress rehearsal). When true: deploy Caddyfile.rehearsal.j2
# (local_certs, no DNS-01) instead of Caddyfile.j2, and skip the
# caddy-dns/cloudflare plugin steps below (not needed without acme_dns —
# and the ephemeral-stage root has no Cloudflare credential to fail with
# anyway, by the isolation doctrine). Set by the rehearsal group_vars
# rehearse.sh generates; standup.sh never sets it, so prod always gets the
# real DNS-01 path.
caddy_rehearsal_mode: false

---
app_user: arxii
app_group: arxii
app_root: /opt/arxii
app_releases_dir: /opt/arxii/releases
# `current` is the arxii PROJECT ROOT (where pyproject.toml + uv.lock live).
# Evennia's actual gamedir is nested inside it under src/ (so server/conf/
# settings.py is at app_gamedir/server/conf/settings.py).
app_current: /opt/arxii/current
app_gamedir: /opt/arxii/current/src
# Deploy-time Django commands run through `python -m django`, NOT through the
# `evennia` launcher, so they need the settings module named explicitly (the
# launcher is what normally supplies it). Must match the gamedir layout above:
# server/conf/settings.py under app_gamedir. See the migrate task for why the
# launcher is bypassed.
app_django_settings_module: server.conf.settings
# Ceiling for the detached migrate task, in seconds. A measured first run is
# ~80 minutes (143 arxii migrations at ~30-35 s each on a 2-core box); this
# allows more than double that before Ansible gives up. Steady-state deploys
# apply nothing and return in seconds.
app_migrate_async_timeout: 10800
# The org repo, matching this checkout's own origin. It was TehomCD/arxii with
# a "# confirm" comment nobody ever actioned, and the first real converge hung
# on it: GitHub answers 404 for a nonexistent-or-private repo, git responds by
# prompting for credentials, and with no tty it blocks forever on /dev/tty.
# Ansible reports that as UNREACHABLE, not as a failed task — see the
# GIT_TERMINAL_PROMPT guard on the checkout task.
app_repo: "https://github.com/Arx-Game/arxii.git"  # public; no credential needed
app_ref: main                            # release tag/ref to deploy
app_service: arxii
# Evennia is a forking Twisted daemon; it writes its PID file relative to
# the gamedir (server/server.pid), NOT relative to app_current.
app_pidfile: /opt/arxii/current/src/server/server.pid
# Evennia is actually TWO daemons (Server + Portal — see src/server/README.md
# "server.pid and portal.pid"). systemd's Type=forking/PIDFile only tracks
# server.pid; the watchdog (below) reads both.
app_portal_pidfile: /opt/arxii/current/src/server/portal.pid

# Release-local paths (Task D). Pre-flip deploy steps (uv sync, frontend
# build, migrate, collectstatic) must run against the RELEASE directory,
# NOT `current`/app_gamedir — the symlink hasn't been flipped to this
# release yet, so a failure here must not touch what's already live.
# Mirrors app_current/app_gamedir one level down (app_ref-scoped instead of
# `current`-scoped).
app_release_dir: "{{ app_releases_dir }}/{{ app_ref }}"
app_release_gamedir: "{{ app_releases_dir }}/{{ app_ref }}/src"
# Where django_hardening rendered the production settings overlay. MUST equal
# roles/django_hardening/defaults/main.yml's dh_settings_path — the tasks here
# only symlink it into the release being built, they never render it.
# acceptance.sh pins the two values equal.
app_secret_settings_src: /etc/arxii/secret_settings.py

# Frontend build (Task D). The box has no Node preinstalled — installed here
# via the NodeSource apt repo, pinned to the Node 20.x line to match CI
# (.github/workflows/ci.yml `node-version: 20`).
app_frontend_node_major: "20"
# frontend/package.json has NO "packageManager" field to read a pnpm-version
# contract from (checked). CI instead pins the pnpm MAJOR via
# `pnpm/action-setup { version: 9 }` in .github/workflows/ci.yml — mirror
# that pin here (corepack resolves the latest matching 9.x release) rather
# than inventing an unpinned "latest".
app_frontend_pnpm_version: "9"
app_frontend_dir: "{{ app_release_dir }}/frontend"
# vite.config.ts `build.outDir` — see frontend/vite.config.ts.
app_frontend_dist_index: "{{ app_release_dir }}/src/web/static/dist/index.html"
# Rebuild-decision fingerprint (#2236 review): written next to dist/ after a
# successful frontend build, recording the Node major + pnpm version used.
# The skip check used to be "checkout changed OR dist missing" only — a
# dist/ bundle built under an OLDER app_frontend_node_major/
# app_frontend_pnpm_version pin would silently survive forever on an
# unchanged checkout even after those defaults were bumped. This marker
# makes a toolchain-pin bump also force a rebuild.
app_frontend_toolchain_marker: "{{ app_release_dir }}/src/web/static/dist/.arxii-toolchain"

# Reload hardening (2026-08-23 standup failure: the SSH connection died on
# the reload task itself and a re-converge would have silently skipped it).
# Localhost web backend the post-reload health check polls. MUST equal
# roles/caddy/defaults/main.yml's caddy_backend — same "two roles pinned
# equal" idiom as app_secret_settings_src above; acceptance.sh pins them.
app_web_backend: "127.0.0.1:4001"
# Written (the deployed SHA) only AFTER a reload has passed the health
# check. Compared on every converge, so a run that died mid-reload gets the
# reload re-fired by the next button press instead of silently skipped.
app_reload_stamp: /opt/arxii/reloaded_sha

# First-run Django/Evennia superuser. Username + email are operator choices
# (set via Environment Variables on the workflow); the password comes from
# the gated Environment Secret ARXII_DJANGO_SUPERUSER_PASSWORD and is
# consumed by `evennia createsuperuser --noinput`. Creation is guarded by
# an existence check, so re-runs are idempotent (a superuser already in
# the DB means the task is skipped, not retried).
app_superuser_username: "{{ lookup('env', 'ARXII_DJANGO_SUPERUSER_USERNAME') | default('arxii_admin', true) }}"
app_superuser_email: "{{ lookup('env', 'ARXII_DJANGO_SUPERUSER_EMAIL') | default('admin@example.invalid', true) }}"

# Pre-migration dump (ADR-0237). Since alpha the production database holds
# authored content that exists in no other copy, and the migrate task below
# runs unattended on every converge — so a RemoveField/DeleteModel that
# reached main destroys that content with no human in the loop. The nightly
# backup (roles/backups, OnCalendar 03:30) can be up to ~24h stale at that
# moment, which is the window this dump closes: it runs immediately before
# migrate, and only when migrate actually has something to apply.
# MUST equal roles/postgres/defaults/main.yml's postgres_version — same "two
# roles pinned equal" idiom as app_secret_settings_src/app_web_backend above,
# and acceptance.sh pins them. pg_dump REFUSES to dump a server newer than
# itself ("aborting because of server version mismatch" — observed live at
# client 16 vs server 17 while developing this), so an unversioned
# `postgresql-client` that drifts behind a bumped postgres_version would fail
# every pre-migration dump and, because this task is fail-closed by design,
# block every migrating deploy until noticed.
app_premigrate_pg_version: 16
app_premigrate_dir: /var/backups/arxii-premigrate
app_premigrate_db: arxii
app_premigrate_db_user: arxii
# How many pre-migration dumps to retain. This is a SHORT-HORIZON net —
# rolled off after this many migrating deploys — and deliberately so: it
# exists to make "the migration I just shipped ate a column" a restore
# rather than a loss. Data loss noticed weeks later is the nightly offsite
# chain's job (roles/backups + roles/offsite_replication), not this one.
app_premigrate_keep: 5
# Refuse to dump unless free space on app_premigrate_dir's filesystem is at
# least this fraction of the live database size. A gzip -9 plain-SQL dump of
# a Postgres DB typically lands at 10-20% of on-disk size, so 50% is a wide
# margin — chosen because the failure it prevents (filling the disk out from
# under Postgres on the box that has no standby) is far worse than a deploy
# that stops and asks for attention.
app_premigrate_free_space_ratio_percent: 50

---
# 0751 for the same reason as the app root in roles/base: Caddy serves
# /static/* from <releases>/<ref>/src/server/.static and must traverse to reach
# it. Execute-for-other permits traversal only — no listing, and file modes are
# untouched, so the 0640 secret_settings.py inside each release stays
# unreadable to the web server.
- name: Ensure releases dir exists (0751 so Caddy can traverse to /static)
  ansible.builtin.file:
    path: "{{ app_releases_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0751"

- name: Check out the release at its ref (idempotent; no secrets — public repo)
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    version: "{{ app_ref }}"
    dest: "{{ app_release_dir }}"
    depth: 1
  become: true
  become_user: "{{ app_user }}"
  # Fail fast instead of hanging. Unauthenticated git against a repo GitHub
  # will not show you gets a 404, and git's reflex is to ask for a username
  # and password. With no tty it blocks on /dev/tty producing no output, the
  # connection eventually dies, and Ansible reports UNREACHABLE rather than a
  # failed task — which points the operator at the network instead of at the
  # URL. With prompting disabled, a bad app_repo is a clear, immediate error.
  environment:
    GIT_TERMINAL_PROMPT: "0"
  register: app_checkout

# #2236 Phase 5 (Sentry). app_checkout.after is the resolved commit SHA
# ansible.builtin.git actually fetched/checked out for app_ref — the honest
# "what got deployed" value, not an approximation from the operator/CI
# controller's own HEAD (which could differ from what this checkout
# actually fetched). secrets_vault's template (rendered earlier in this
# same play — see site.yml's role order) always writes an empty
# SENTRY_RELEASE= placeholder line specifically so this regexp target
# exists on every run, which is what keeps this task's changed-state
# idempotent (only "changed" when the deployed SHA actually differs from
# the last converge, not on every run). No separate reload/handler is
# needed: this value changes if and only if app_checkout changes, and the
# "Reload Evennia" task below already keys its restart condition off
# `app_checkout is changed`.
- name: Stamp the deployed release SHA into the EnvironmentFile (SENTRY_RELEASE)
  ansible.builtin.lineinfile:
    path: "{{ secrets_env_file | default('/etc/arxii/arxii.env') }}"
    regexp: '^SENTRY_RELEASE='
    line: "SENTRY_RELEASE={{ app_checkout.after }}"
    owner: "{{ secrets_owner | default('arxii') }}"
    group: "{{ secrets_group | default('arxii') }}"
    mode: "0600"
  no_log: true

# NOTE: the `current` symlink is intentionally NOT flipped yet. Everything
# below through collectstatic runs against {{ app_release_dir }} (the
# checked-out release), not `current` — a failure in uv sync / the frontend
# build / migrate / collectstatic must leave the currently-live release
# (whatever `current` still points at) untouched, instead of stranding a
# half-deployed `current` with no rollback.

# Which is exactly why the hardening overlay is symlinked in here rather than
# written to a release path by django_hardening: `current` does not exist at
# all on a first converge, and points at the PREVIOUS release on every later
# one, so the release being migrated below would never see the overlay.
# django_hardening renders the file itself (earlier in site.yml's role order)
# at dh_settings_path — app_secret_settings_src MUST equal that value; both
# defaults carry the pairing note and acceptance.sh pins them equal.
# `secret_settings.py` is gitignored, so the checkout above never places a
# real file at this path for the link to fight with.
- name: Link the hardening overlay into this release (BEFORE migrate reads it)
  ansible.builtin.file:
    src: "{{ app_secret_settings_src }}"
    dest: "{{ app_release_gamedir }}/server/conf/secret_settings.py"
    state: link
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    follow: false

# Build the project venv from uv.lock so the `evennia` entrypoint exists
# under the service user. --frozen ensures we install EXACTLY what the
# lockfile says (no implicit resolution drift); --no-dev skips dev deps.
- name: Build the project venv from uv.lock (uv sync --frozen --no-dev)
  ansible.builtin.command:
    cmd: "{{ base_uv_bin }} sync --frozen --no-dev"
    chdir: "{{ app_release_dir }}"
  become: true
  become_user: "{{ app_user }}"
  register: app_uv_sync
  changed_when: app_uv_sync.rc == 0 and app_uv_sync.stdout is search('Installed|Removed|Updated|Resolved')

# --- Frontend build ---------------------------------------------------------
# The React app is the primary interface (see frontend/CLAUDE.md); its build
# output (src/web/static/dist/) is gitignored and this box has no Node, so we
# build it here rather than shipping prebuilt assets. Placed AFTER uv sync
# (not before) because frontend/scripts/postbuild.mjs runs
# `uv run --project .. arx manage collectstatic --noinput` as part of
# `pnpm build` — its guard only checks whether `uv` is on PATH, not whether
# the project venv has been synced. Running the frontend build before uv
# sync would let that guard pass (uv IS on PATH, installed by the base role)
# but then `uv run` would sync-on-demand without --frozen/--no-dev,
# duplicating and potentially drifting from the explicit uv sync step above.
# Placing the build after uv sync means postbuild's `uv run` finds an
# already-synced --frozen --no-dev venv and just uses it.
- name: Check for an existing NodeSource keyring (idempotency)
  ansible.builtin.stat:
    path: /usr/share/keyrings/nodesource.gpg
  register: app_node_keyring

# NodeSource does not publish a fixed checksum for this key (it can rotate
# independent of releases) — HTTPS/TLS is the only integrity guarantee
# available here, matching NodeSource's own documented install instructions.
- name: Download the NodeSource GPG signing key (TLS-only; no published checksum to pin)
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /tmp/nodesource-repo.gpg.key
    mode: "0644"
  when: not app_node_keyring.stat.exists

- name: Dearmor the NodeSource key into the apt keyring dir
  ansible.builtin.command:
    cmd: >-
      gpg --dearmor -o /usr/share/keyrings/nodesource.gpg
      /tmp/nodesource-repo.gpg.key
    creates: /usr/share/keyrings/nodesource.gpg
  when: not app_node_keyring.stat.exists

- name: Lock down the NodeSource keyring perms
  ansible.builtin.file:
    path: /usr/share/keyrings/nodesource.gpg
    owner: root
    group: root
    mode: "0644"
  when: not app_node_keyring.stat.exists

# deb822 format (Ubuntu noble's own default sources style) rather than a
# single-line `.list` entry — the equivalent one-line form doesn't fit this
# repo's 100-char line limit without an awkward mid-URL wrap.
- name: Add the deb822 signed-by NodeSource apt repo for Node {{ app_frontend_node_major }}
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nodesource.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://deb.nodesource.com/node_{{ app_frontend_node_major }}.x
      Suites: nodistro
      Components: main
      Signed-By: /usr/share/keyrings/nodesource.gpg
  register: app_nodesource_sources

# update_cache only fires when the sources file above actually changed (a
# stale cache would miss a brand-new repo on the run that added it, but an
# unconditional update_cache: true was paying the full `apt-get update`
# cost on every single converge forever after, even once nodejs is already
# installed and the sources file is untouched).
- name: Install NodeSource Node.js major {{ app_frontend_node_major }}
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: "{{ app_nodesource_sources is changed }}"
    lock_timeout: 600

- name: Enable corepack shims (system-wide; bundled with Node.js)
  ansible.builtin.command: corepack enable
  changed_when: false

# frontend/package.json has no "packageManager" field (see defaults/main.yml
# comment) — pin/activate the pnpm major CI uses instead of "latest".
- name: Pin + activate the pnpm version corepack will use (matches CI's pin)
  ansible.builtin.command: "corepack prepare pnpm@{{ app_frontend_pnpm_version }} --activate"
  environment:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  become: true
  become_user: "{{ app_user }}"
  changed_when: false

# Idempotency precheck: a converge where the checkout didn't change and a
# built bundle already exists for this release needs no rebuild (pnpm
# install + vite build are the slow part of every deploy otherwise). The
# toolchain marker (below) closes the gap where dist/ exists and the
# checkout is unchanged, but app_frontend_node_major/app_frontend_
# pnpm_version themselves were bumped since that bundle was built.
- name: Check whether this release already has a built frontend bundle
  ansible.builtin.stat:
    path: "{{ app_frontend_dist_index }}"
  register: app_frontend_dist_stat

- name: Check the frontend bundle's toolchain marker
  ansible.builtin.stat:
    path: "{{ app_frontend_toolchain_marker }}"
  register: app_frontend_toolchain_marker_stat

- name: Read the frontend bundle's toolchain marker, if present
  ansible.builtin.slurp:
    src: "{{ app_frontend_toolchain_marker }}"
  register: app_frontend_toolchain_marker_content
  when: app_frontend_toolchain_marker_stat.stat.exists

- name: Decide whether the frontend needs a rebuild
  ansible.builtin.set_fact:
    app_frontend_needs_build: >-
      {{ app_checkout is changed
         or not app_frontend_dist_stat.stat.exists
         or not app_frontend_toolchain_marker_stat.stat.exists
         or (app_frontend_toolchain_marker_content | default({'content': ''})).content
            | b64decode != (app_frontend_node_major ~ ' ' ~ app_frontend_pnpm_version) }}

- name: Install frontend deps (pnpm install --frozen-lockfile)
  ansible.builtin.command: pnpm install --frozen-lockfile
  args:
    chdir: "{{ app_frontend_dir }}"
  become: true
  become_user: "{{ app_user }}"
  when: app_frontend_needs_build
  register: app_frontend_pnpm_install
  changed_when: app_frontend_needs_build

# vite always rewrites hashed assets, so "changed" here is really "did we
# decide to build" (see app_frontend_needs_build above) rather than
# anything vite itself reports.
- name: Build the frontend bundle (pnpm build; runs postbuild's collectstatic hook)
  ansible.builtin.command: pnpm build
  args:
    chdir: "{{ app_frontend_dir }}"
  become: true
  become_user: "{{ app_user }}"
  when: app_frontend_needs_build
  register: app_frontend_build
  changed_when: app_frontend_needs_build

# noqa'd: this is deliberately NOT a handler — the marker must be written
# in-order, immediately after the build task it records, not at end of play
# (a failed later task would otherwise leave a built dist with no marker).
- name: Record the frontend build's toolchain marker (node major + pnpm version)  # noqa: no-handler
  ansible.builtin.copy:
    content: "{{ app_frontend_node_major }} {{ app_frontend_pnpm_version }}"
    dest: "{{ app_frontend_toolchain_marker }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0644"
  become: true
  become_user: "{{ app_user }}"
  when: app_frontend_build is changed

# Django/Evennia migrations are idempotent: re-running when up-to-date is a
# no-op (output contains no "Applying" lines). Sourcing the rendered
# EnvironmentFile gives the migration the Postgres password + SECRET_KEY it
# needs. Runs every deploy by design — the gate against schema-breaking
# changes lives in the release-safety classifier upstream, not here.
#
# Deliberately `python -m django migrate`, NOT `evennia migrate`. Evennia's
# launcher calls check_database() before it dispatches the command, and that
# helper imports evennia, whose utils/gametime.py queries server_serverconfig
# at import time. On a half-migrated database that table does not exist yet,
# so `evennia migrate` dies with ProgrammingError: the command that creates
# the table cannot run until the table exists. check_database() also falls
# through to an interactive create_superuser() prompt when Account #1 is
# missing, which blocks forever with no tty attached. Django's own entrypoint
# has neither behaviour. (Diagnosed on the prod standup, 2026-08-15.)
#
# async/poll: a first-run migration is ~80 minutes on a 2-core box, and the
# SSH channel carries no output for any of it. When that connection dropped
# at 09:23 UTC on 2026-08-15, systemd tore down the login session scope and
# killed the migrate process with it, stranding the database at migration
# 0013 while Ansible waited for a reply that was never coming. Running the
# task detached and polling for its result makes a mid-migration disconnect
# cost a reconnect instead of the whole run.
- name: Apply Django/Evennia DB migrations (idempotent on every deploy)
  ansible.builtin.shell: |
    set -a
    # shellcheck source=/dev/null
    . {{ secrets_env_file | default('/etc/arxii/arxii.env') }}
    set +a
    set -o pipefail
    {{ base_uv_bin }} run python -m django migrate --noinput
  args:
    chdir: "{{ app_release_gamedir }}"
    executable: /bin/bash
  environment:
    DJANGO_SETTINGS_MODULE: "{{ app_django_settings_module }}"
  become: true
  become_user: "{{ app_user }}"
  async: "{{ app_migrate_async_timeout }}"
  poll: 15
  register: app_migrate
  changed_when: "'Applying' in app_migrate.stdout"

# Collect Django/Evennia static assets so Caddy can serve /static/ off disk
# (admin CSS/JS, Evennia static, anything Django's staticfiles knows about).
# (The frontend build's postbuild hook already ran collectstatic once for
# the hashed dist/ assets; this is Django/Evennia's own full collectstatic
# pass and is idempotent to re-run.) Guarded: skip entirely on a converge
# where neither the checkout nor the frontend build changed — postbuild's
# collectstatic already ran during THIS release's build (or a prior one,
# if the frontend didn't need a rebuild either), so there is nothing new
# to collect and the pass-over-every-static-file cost is pure waste.
# Uses `python -m django`, not `evennia`, for the reason given on the migrate
# task: at this point in the play no superuser exists yet, so the launcher's
# check_database() would stop on an interactive create_superuser() prompt.
- name: Collect Django static files (idempotent)
  ansible.builtin.shell: |
    set -a
    # shellcheck source=/dev/null
    . {{ secrets_env_file | default('/etc/arxii/arxii.env') }}
    set +a
    set -o pipefail
    {{ base_uv_bin }} run python -m django collectstatic --noinput
  args:
    chdir: "{{ app_release_gamedir }}"
    executable: /bin/bash
  environment:
    DJANGO_SETTINGS_MODULE: "{{ app_django_settings_module }}"
  become: true
  become_user: "{{ app_user }}"
  when: app_checkout is changed or app_frontend_build is changed
  register: app_collectstatic
  changed_when: "'0 static files copied' not in app_collectstatic.stdout"

# Everything above is proven to work against THIS release directory before
# we ever touch what's live. Only now do we flip the symlink.
- name: Atomically point `current` at this release
  ansible.builtin.file:
    src: "{{ app_release_dir }}"
    dest: "{{ app_current }}"
    state: link
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    force: true
  register: app_symlink

# Idempotent superuser bootstrap: if any superuser already exists, skip
# the create entirely. The credentials come from gated Environment values
# (username/email = Variables, password = Secret); `django createsuperuser
# --noinput` reads them from DJANGO_SUPERUSER_* env. Both this task and the
# guard above it go through `python -m django` rather than the `evennia`
# launcher: the launcher's own check_database() tries to create a superuser
# interactively when Account #1 is absent, which is exactly the state these
# two tasks exist to detect and fix.
# Runs post-flip (via app_gamedir, which now resolves through `current` to
# this release) — it needs the running config, same as before; only its
# position relative to the symlink flip changed.
- name: Check whether a Django superuser already exists (first-run guard)
  ansible.builtin.shell: |
    set -a
    # shellcheck source=/dev/null
    . {{ secrets_env_file | default('/etc/arxii/arxii.env') }}
    set +a
    set -o pipefail
    {{ base_uv_bin }} run python -m django shell <<'PY'
    from django.contrib.auth import get_user_model
    print('YES' if get_user_model().objects.filter(is_superuser=True).exists() else 'NO')
    PY
  args:
    chdir: "{{ app_gamedir }}"
    executable: /bin/bash
  environment:
    DJANGO_SETTINGS_MODULE: "{{ app_django_settings_module }}"
  become: true
  become_user: "{{ app_user }}"
  register: app_su_check
  changed_when: false

- name: Create the Django superuser on first run only
  ansible.builtin.shell: |
    set -a
    # shellcheck source=/dev/null
    . {{ secrets_env_file | default('/etc/arxii/arxii.env') }}
    set +a
    set -o pipefail
    {{ base_uv_bin }} run python -m django createsuperuser --noinput
  args:
    chdir: "{{ app_gamedir }}"
    executable: /bin/bash
  environment:
    DJANGO_SETTINGS_MODULE: "{{ app_django_settings_module }}"
    DJANGO_SUPERUSER_USERNAME: "{{ app_superuser_username }}"
    DJANGO_SUPERUSER_EMAIL: "{{ app_superuser_email }}"
  become: true
  become_user: "{{ app_user }}"
  no_log: true
  when: "'YES' not in (app_su_check.stdout | default(''))"
  register: app_su_create
  changed_when: app_su_create.rc == 0

- name: Install the systemd unit
  ansible.builtin.template:
    src: arxii.service.j2
    dest: "/etc/systemd/system/{{ app_service }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Ensure the game service is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ app_service }}"
    enabled: true
    state: started
    daemon_reload: true

# --- Reload (drop-resilient + state-derived) --------------------------------
# Two hardening layers, both from the 2026-08-23 standup failure, where the
# SSH connection was closed from the host side during this exact task after
# 84 green ones — and a re-run of the button would have silently skipped the
# reload, leaving the Server on pre-deploy code while reporting green:
#
# 1. "Needs a reload" is derived from HOST state, not only from run-local
#    change flags. The flags (`app_checkout is changed` etc.) exist only
#    inside the run that made the changes; a play that dies between the
#    symlink flip and a confirmed reload loses them, and the next converge
#    of the same ref sees nothing changed. The stamp file — written only
#    after the reload passes the health check below — records which release
#    the Server last provably reloaded into; stamp != checked-out SHA forces
#    the reload regardless of the flags.
#
# 2. The reload itself survives a dropped SSH connection, in the same spirit
#    as the migrate task's async/poll (2026-08-15 incident): ignore the
#    unreachable, reconnect, retry. Once systemd accepts a reload job it
#    completes regardless of the caller, so the retry is at worst a harmless
#    second reload of an already-current Server (Portal keeps players
#    connected through it either way).
#
# The 2026-08-23 evening run proved the drop is not random: reconnect
# succeeded, then the retry died IDENTICALLY, both attempts at ~260 s — the
# GitHub runner's Azure SNAT evicting a flow idle for ~4 min. A blocking
# `systemctl reload` sends nothing for the several minutes a Server restart
# now takes, and ansible.cfg's keepalives were silently not loaded (fixed in
# standup.sh/rehearse.sh: ANSIBLE_CONFIG is now exported). async/poll below
# is the second, independent guard: each 15 s poll is fresh channel traffic,
# so the reload survives even if the cfg regresses to unloaded again.
- name: Read which release the Server last provably reloaded into
  ansible.builtin.slurp:
    src: "{{ app_reload_stamp }}"
  register: app_reload_stamp_read
  failed_when: false

# `| bool` on every consumer below — the folded expression renders as the
# STRING "True"/"False", same gotcha as roles/caddy's caddy_archive_enabled.
- name: Decide whether Evennia needs a reload (change flags OR stale stamp)
  ansible.builtin.set_fact:
    app_needs_reload: >-
      {{ app_checkout is changed
         or app_symlink is changed
         or app_uv_sync is changed
         or app_frontend_build is changed
         or app_migrate is changed
         or app_collectstatic is changed
         or (app_reload_stamp_read.content | default('') | b64decode | trim)
            != app_checkout.after }}

# async/poll: the reload blocks for the full Server restart (minutes) with
# no output; detached-plus-poll keeps the SSH path active every 15 s instead
# of one long silent block. 600 s comfortably exceeds systemd's own
# TimeoutStartSec=300 cap on ExecReload, so a genuinely hung reload is
# failed by systemd (loudly, as a task failure) before the async limit.
- name: Reload Evennia on a code / deps / migration change (Portal keeps players connected)
  ansible.builtin.systemd_service:
    name: "{{ app_service }}"
    state: reloaded
  when: app_needs_reload | bool
  register: app_reload
  ignore_unreachable: true
  async: 600
  poll: 15

- name: Reconnect if the SSH channel dropped mid-reload
  ansible.builtin.wait_for_connection:
    timeout: 300
  when: (app_needs_reload | bool) and (app_reload.unreachable | default(false))

- name: Retry the reload after a reconnect (idempotent; systemd finishes an accepted job anyway)
  ansible.builtin.systemd_service:
    name: "{{ app_service }}"
    state: reloaded
  when: (app_needs_reload | bool) and (app_reload.unreachable | default(false))
  async: 600
  poll: 15

# Direct to the localhost-bound backend (not through Caddy/Cloudflare), with
# the real Host header — django_hardening's ALLOWED_HOSTS rejects a bare
# 127.0.0.1 Host with a 400. 301/302 accepted alongside 200: an SSL-redirect
# answer still proves the Server process is up and serving requests.
- name: Wait until the reloaded Server answers on the web backend
  ansible.builtin.uri:
    url: "http://{{ app_web_backend }}/"
    headers:
      Host: "{{ caddy_web_fqdn }}"
    status_code: [200, 301, 302]
  register: app_reload_health
  until: app_reload_health is succeeded
  retries: 60
  delay: 5
  when: app_needs_reload | bool

- name: Stamp the reloaded release SHA (a re-run re-derives "reload landed" from this)
  ansible.builtin.copy:
    content: "{{ app_checkout.after }}"
    dest: "{{ app_reload_stamp }}"
    owner: root
    group: root
    mode: "0644"
  when: app_needs_reload | bool

# --- Portal-crash watchdog ---------------------------------------------------
# Type=forking + PIDFile=server.pid (arxii.service.j2) only supervises the
# Server daemon. Evennia actually runs Server + Portal as two separate
# processes (server.pid + portal.pid — see src/server/README.md); if the
# Portal alone dies, systemd still sees the unit as "active" (Server is
# fine) and does nothing, but players cannot connect. This timer-driven
# script checks BOTH pidfiles and restarts the unit + fires an off-box
# alert when the unit claims active but a daemon is dead.
- name: Install the watchdog script
  ansible.builtin.template:
    src: arxii-watchdog.sh.j2
    dest: /usr/local/sbin/arxii-watchdog
    owner: root
    group: root
    mode: "0750"

- name: Install the watchdog service (reads OFFBOX_ALERT_TOKEN from the EnvironmentFile)
  ansible.builtin.copy:
    dest: /etc/systemd/system/arxii-watchdog.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Arx II Portal/Server liveness watchdog (restart-on-half-dead)
      [Service]
      Type=oneshot
      EnvironmentFile={{ secrets_env_file | default('/etc/arxii/arxii.env') }}
      ExecStart=/usr/local/sbin/arxii-watchdog
  notify: Reload systemd

- name: Install the watchdog timer (checks every minute)
  ansible.builtin.copy:
    dest: /etc/systemd/system/arxii-watchdog.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Arx II watchdog check (every minute)
      [Timer]
      OnCalendar=*-*-* *:*:00
      Persistent=true
      [Install]
      WantedBy=timers.target
  notify: Reload systemd

- name: Enable the watchdog timer
  ansible.builtin.systemd_service:
    name: arxii-watchdog.timer
    enabled: true
    state: started
    daemon_reload: true

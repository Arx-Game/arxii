---
# Assertion role — verifies the on-box secret posture. Object Lock on the
# backup buckets was meant to be the authoritative backstop against an
# on-box backup-key compromise, but it's a KNOWN GAP (#2236 — see
# infra/README.md "Known gap: Object Lock"); until it lands, bucket-scoped
# writer keys + the independent R2 copy are the actual backstop, and this
# role's local-hygiene checks matter more than they otherwise would.

- name: Stat the EnvironmentFile
  ansible.builtin.stat:
    path: "{{ secrets_env_file | default('/etc/arxii/arxii.env') }}"
  register: envfile

- name: EnvironmentFile must exist, be 0600, owned by the service user
  ansible.builtin.assert:
    quiet: true
    that:
      - envfile.stat.exists
      - "envfile.stat.mode == '0600'"
      - "envfile.stat.pw_name == (secrets_owner | default('arxii'))"
    fail_msg: "EnvironmentFile is missing or not 0600/service-user-owned."

- name: Linode/Cloudflare PROVISIONING tokens must NOT be on the box
  ansible.builtin.assert:
    quiet: true
    that:
      - "lookup('env', item) | length == 0"
    fail_msg: "'{{ item }}' (operator/CI-only provisioning token) is present on the box — it must never reach here."
  loop:
    - LINODE_TOKEN
    - CLOUDFLARE_API_TOKEN
  no_log: true

- name: The deployed app dir must contain no committed secret files
  ansible.builtin.find:
    paths: "{{ app_current | default('/opt/arxii/current') }}"
    patterns: ["*.pem", "*.key", ".env", "secrets.yml", "*.tfstate"]
    recurse: true
    hidden: true
  register: leaked

# The raw scan always matches two legitimate sets of files on a healthy box:
# the virtualenv's vendored CA bundle and TLS test fixtures, and Evennia's own
# SSL-telnet cert/key. See this role's defaults for why each is expected. Both
# are dropped here so the assertion below only fires on something genuinely
# unexpected — a stray key an operator copied in, a committed .env, a tfstate.
- name: Reduce the scan to genuinely unexpected secret-shaped files
  ansible.builtin.set_fact:
    leaked_unexpected: >-
      {{ leaked.files
         | map(attribute='path')
         | reject('search', secrets_scan_exclude_venv_re)
         | reject('in', secrets_ssl_telnet_files)
         | list }}

- name: Fail if any secret-shaped file is committed in the app checkout
  ansible.builtin.assert:
    quiet: true
    that: "leaked_unexpected | length == 0"
    fail_msg: "Secret-shaped files found in the app checkout: {{ leaked_unexpected }}"

# The SSL-telnet material is excluded from the scan above, so assert its
# posture directly rather than leaving it unchecked. A world-readable telnet
# private key is exactly the kind of thing this role exists to catch. The
# private key and the two public files get different checks — see this role's
# defaults for why 0600 is both pointless and unholdable on the public ones.
- name: Stat the SSL-telnet private key
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ secrets_ssl_telnet_private_files }}"
  register: secrets_ssl_private_stat

- name: SSL-telnet private key must be 0600 and service-user-owned
  ansible.builtin.assert:
    quiet: true
    that:
      - "not item.stat.exists or item.stat.mode == '0600'"
      - "not item.stat.exists or item.stat.pw_name == (secrets_owner | default('arxii'))"
    fail_msg: >-
      {{ item.item }} is not 0600/service-user-owned
      (mode={{ item.stat.mode | default('absent') }},
      owner={{ item.stat.pw_name | default('absent') }}).
  loop: "{{ secrets_ssl_private_stat.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Stat the SSL-telnet public material
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ secrets_ssl_telnet_public_files }}"
  register: secrets_ssl_public_stat

# Readable by anyone is fine and expected here. Writable by anyone is not: an
# attacker who can rewrite the cert can serve players a key it also controls.
- name: SSL-telnet public material must be service-user-owned and not group/world-writable
  ansible.builtin.assert:
    quiet: true
    that:
      - "not item.stat.exists or not item.stat.wgrp"
      - "not item.stat.exists or not item.stat.woth"
      - "not item.stat.exists or item.stat.pw_name == (secrets_owner | default('arxii'))"
    fail_msg: >-
      {{ item.item }} is group/world-writable or not service-user-owned
      (mode={{ item.stat.mode | default('absent') }},
      owner={{ item.stat.pw_name | default('absent') }}).
  loop: "{{ secrets_ssl_public_stat.results }}"
  loop_control:
    label: "{{ item.item }}"

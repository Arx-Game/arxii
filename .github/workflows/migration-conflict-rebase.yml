name: Migration conflict rebase

# Since #2906 there is one migration sequence and one max_migration.txt, so every
# merge of a migration-bearing PR leaves the next one CONFLICTING and drops it from
# the merge queue (#4826, #4828, #4832). This job fixes the one conflict shape that
# has a deterministic answer, and only that one (#4879):
#
#   * the PR's only conflict with main is max_migration.txt, and
#   * the PR adds one linear chain of migrations and changes no existing one.
#
# tools/auto_rebase_migration.py merges main in (never a rebase or force-push),
# renumbers the PR's chain after main's tip, rewrites only each file's in-app
# dependency, and then proves the result independently: the migrations directory
# differs from main by exactly the renamed chain plus max_migration.txt, each file's
# AST is unchanged apart from that one name, the graph has one leaf, and no migrations
# are missing. Anything else is refused with a PR comment, and nothing is pushed.
#
# The push needs MIGRATION_REBASE_TOKEN: a fine-grained PAT on this repo with
# Contents and Pull requests read/write. GITHUB_TOKEN would push fine, but a push
# made with it triggers no pull_request workflows, so the PR would sit with no CI on
# its new head. Without the secret the job says so and exits green.
#
# SUPPLY CHAIN: third-party actions are pinned to a full commit SHA.

on:
  push:
    branches: [main]
    paths: ['src/world/migrations/max_migration.txt']
  workflow_dispatch:
    inputs:
      pr:
        description: 'One PR number to fix (blank = every open PR)'
        required: false

permissions:
  contents: read

# One run at a time: each run rescans every open PR against the current main, so a
# queued run never misses work, and two runs never push to the same branch at once.
concurrency:
  group: migration-conflict-rebase
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOKEN: ${{ secrets.MIGRATION_REBASE_TOKEN }}
    steps:
      - name: Require the push token
        id: token
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::MIGRATION_REBASE_TOKEN is not set; skipping (see this workflow's header)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.token.outputs.ok == 'true'
        with:
          fetch-depth: 0
          # No credential in .git/config: the graph check loads the PR's models, and
          # PR code must not be able to read the push token. The driver pushes with
          # an explicit URL instead.
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        if: steps.token.outputs.ok == 'true'
        with:
          python-version: '3.13'
      - if: steps.token.outputs.ok == 'true'
        run: uv sync
      - name: Fix every PR whose only conflict is max_migration.txt
        if: steps.token.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.MIGRATION_REBASE_TOKEN }}
          ONLY_PR: ${{ github.event.inputs.pr }}
        run: bash tools/auto_rebase_migration_ci.sh

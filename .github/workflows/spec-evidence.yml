name: Spec evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  review-evidence:
    name: review-evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Validate exact-revision evidence report
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          readarray -t values < <(python3 - <<'PY'
          import json
          import re
          import os

          with open(os.environ["EVENT_PATH"], encoding="utf-8") as stream:
              event = json.load(stream)
          body = event["pull_request"].get("body") or ""
          # Ordinary PRs do not need spec/demo evidence. The issue-to-merged-pr
          # template opts in explicitly, so only that flow is hard-gated.
          if "<!-- review-evidence-required -->" not in body:
              print("review evidence not required for this PR")
              raise SystemExit(0)
          with open("/tmp/pr-body.md", "w", encoding="utf-8") as stream:
              stream.write(body)
          match = re.search(r"^- Report: `([^`]+)`$", body, re.MULTILINE)
          if not match:
              raise SystemExit("PR body is missing the committed review report link")
          print(match.group(1))
          head_sha = event["pull_request"]["head"]["sha"]
          print(head_sha)
          print(f"{head_sha}^1")
          PY
          )
          report_path="${values[0]}"
          head_sha="${values[1]}"
          reviewed_sha="$(git rev-parse "${head_sha}^1")"
          test "$reviewed_sha" = "${values[2]}"
          python3 tools/validate_review_evidence.py "$report_path" \
              --revision "$reviewed_sha" --pr-body /tmp/pr-body.md

name: Spec evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read

jobs:
  review-evidence-not-committed:
    name: review-evidence-not-committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Reject review evidence committed to the repository
        run: |
          set -euo pipefail
          tracked="$(git ls-files docs/reviews)"
          if [ -n "$tracked" ]; then
            echo "::error::Review evidence must not be committed. Found under docs/reviews/:"
            echo "$tracked" | sed 's/^/::error::  /'
            cat <<'MSG'
          Review evidence reports and their screenshots do not belong in main's
          permanent history. The report is a PR comment; the screenshots are served
          from the pushed blob so they keep rendering after the files come out.

          To fix, in this order:
            1. Push once with the files still present, so their blobs exist.
            2. Post the report as a PR comment, with every image linked as
               https://raw.githubusercontent.com/<owner>/<repo>/<pushed-sha>/<path>
            3. Point the PR body's "- Report:" line at that comment URL.
            4. Delete docs/reviews/ and push again.

          Deleting the files without doing steps 2 and 3 does not pass: the
          review-evidence job then has no report to validate and fails instead.
          MSG
            exit 1
          fi
  review-evidence:
    name: review-evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Validate labeled review evidence
        env:
          EVENT_PATH: ${{ github.event_path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          readarray -t values < <(python3 - <<'PY'
          import json
          import os

          from tools.validate_review_evidence import linked_issue_number

          with open(os.environ["EVENT_PATH"], encoding="utf-8") as stream:
              event = json.load(stream)
          body = event["pull_request"].get("body") or ""
          with open("/tmp/pr-body.md", "w", encoding="utf-8") as stream:
              stream.write(body)
          # Review evidence is opt-in through a label on the linked issue.
          # PRs without an issue link cannot be opted in, so leave them alone
          # (this includes Dependabot update PRs). GitHub accepts terminal
          # punctuation after a closing reference, such as "Closes #123.".
          print(linked_issue_number(body) or "")
          print(event["pull_request"]["head"]["sha"])
          PY
          )
          issue_number="${values[0]}"
          head_sha="${values[1]}"
          if [[ -z "$issue_number" ]]; then
              echo "review evidence not required: PR does not link an issue"
              exit 0
          fi
          labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/labels" --paginate --jq '.[].name')"
          if ! grep -qx "review:evidence-required" <<<"$labels"; then
              echo "review evidence not required for issue #${issue_number}"
              exit 0
          fi
          readarray -t report_values < <(python3 - <<'PY'
          import re

          body = open("/tmp/pr-body.md", encoding="utf-8").read()
          if "<!-- review-evidence-required -->" not in body:
              raise SystemExit("labeled issue requires the review-evidence-required PR marker")
          match = re.search(
              r"^- Report: (?:`([^`]+)`|(https://\S+))$", body, re.MULTILINE
          )
          if not match:
              raise SystemExit("labeled issue requires a review report link")
          print(match.group(1) or match.group(2))
          PY
          )
          report_reference="${report_values[0]}"
          if [[ "$report_reference" == https://github.com/*#issuecomment-* ]]; then
              comment_id="${report_reference##*#issuecomment-}"
              gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
                  --jq .body > /tmp/review-evidence.md
              report_path=/tmp/review-evidence.md
          else
              report_path="$report_reference"
          fi
          reviewed_sha="$(git rev-parse "${head_sha}^1")"
          python3 tools/validate_review_evidence.py "$report_path" \
              --revision "$reviewed_sha" --pr-body /tmp/pr-body.md

name: Spec evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read

jobs:
  review-evidence-not-committed:
    name: review-evidence-not-committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject review evidence committed to the repository
        run: |
          set -euo pipefail
          # Both locations are temporary evidence staging areas, never PR contents.
          tracked="$(git ls-files docs/reviews .github/issue-evidence)"
          if [ -n "$tracked" ]; then
            echo "::error::Review evidence must not be committed. Found forbidden evidence files:"
            echo "$tracked" | sed 's/^/::error::  /'
            cat <<'MSG'
          Review evidence reports and their screenshots do not belong in main's
          permanent history. The report is a PR comment; screenshots are served
          from immutable pushed blobs so they keep rendering after the files come out.

          To fix, in this order:
            1. Push once with the files still present, so their blobs exist.
            2. Post the report as a PR comment, with every image linked as
               https://raw.githubusercontent.com/<owner>/<repo>/<pushed-sha>/<path>
            3. Point the PR body's "- Report:" line at that comment URL.
            4. Delete docs/reviews/ and .github/issue-evidence/ and push again.

          Deleting the files without doing steps 2 and 3 does not pass: the
          review-evidence job then has no report to validate and fails instead.
          MSG
            exit 1
          fi
  review-evidence:
    name: review-evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require an explicit closing issue
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          from tools.validate_review_evidence import closing_issue_number, is_dependabot_login

          with open(os.environ["EVENT_PATH"], encoding="utf-8") as stream:
              event = json.load(stream)
          body = event["pull_request"].get("body") or ""
          author = event["pull_request"].get("user", {}).get("login")
          if is_dependabot_login(author):
              print(f"Dependabot PR is exempt from the issue-closing requirement: {author}")
              raise SystemExit(0)
          issue_number = closing_issue_number(body)
          if issue_number is None:
              raise SystemExit(
                  "Every non-Dependabot pull request must explicitly close an issue "
                  "with `Closes #<number>`; use a child issue for partial work."
              )
          print(f"pull request closes issue #{issue_number}")

          # GitHub closes every issue or PR a closing keyword names when this merges
          # (#4903: "the bot fixed #4866" closed an open PR). Edit the body to fix.
          from tools.closing_keywords import crowded_closing_lines, stray_references

          stray = stray_references(body, issue_number)
          if stray:
              raise SystemExit(
                  f"The PR body names other issues after a closing keyword: {stray}. "
                  f"Merging would close them. Only #{issue_number} may follow close/fix/"
                  "resolve; reword the rest (e.g. 'on #N', 'renumbered #N')."
              )
          # GitHub closes only the first reference on a line (#4922): one per line.
          crowded = crowded_closing_lines(body)
          if crowded:
              raise SystemExit(
                  f"The PR body tries to close several issues on one line: {crowded}. "
                  "GitHub closes only the first; put each Closes #N on its own line."
              )
          PY
      - name: Validate labeled review evidence
        env:
          EVENT_PATH: ${{ github.event_path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          readarray -t values < <(python3 - <<'PY'
          import json
          import os

          from tools.validate_review_evidence import closing_issue_number

          with open(os.environ["EVENT_PATH"], encoding="utf-8") as stream:
              event = json.load(stream)
          body = event["pull_request"].get("body") or ""
          with open("/tmp/pr-body.md", "w", encoding="utf-8") as stream:
              stream.write(body)
          # Review evidence is opt-in through a label on the closing issue.
          # The preceding step requires every non-Dependabot PR to provide that issue link.
          # GitHub accepts terminal punctuation after a closing reference, such
          # as "Closes #123.".
          print(closing_issue_number(body) or "")
          print(event["pull_request"]["head"]["sha"])
          PY
          )
          issue_number="${values[0]}"
          head_sha="${values[1]}"
          if [[ -z "$issue_number" ]]; then
              echo "review evidence not required: PR does not link an issue"
              exit 0
          fi
          labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/labels" --paginate --jq '.[].name')"
          if ! grep -qx "review:evidence-required" <<<"$labels"; then
              echo "review evidence not required for issue #${issue_number}"
              exit 0
          fi
          readarray -t report_values < <(python3 - <<'PY'
          from tools.validate_review_evidence import REPORT_LINE

          body = open("/tmp/pr-body.md", encoding="utf-8").read()
          if "<!-- review-evidence-required -->" not in body:
              raise SystemExit("labeled issue requires the review-evidence-required PR marker")
          match = REPORT_LINE.search(body)
          if not match:
              raise SystemExit("labeled issue requires a review report link")
          print(match.group(1) or match.group(2))
          PY
          )
          report_reference="${report_values[0]}"
          if [[ "$report_reference" == https://github.com/*#issuecomment-* ]]; then
              comment_id="${report_reference##*#issuecomment-}"
              gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
                  --jq .body > /tmp/review-evidence.md
              report_path=/tmp/review-evidence.md
          else
              report_path="$report_reference"
          fi
          # Validate the report first, then prove every update since its reviewed revision.
          python3 tools/validate_review_evidence.py "$report_path" --pr-body /tmp/pr-body.md
          report_sha="$(python3 - "$report_path" <<'PY'
          import sys
          from tools.validate_review_evidence import _field

          with open(sys.argv[1], encoding="utf-8") as stream:
              print(_field(stream.readlines(), "Reviewed revision").strip("`"))
          PY
          )"
          python3 tools/review_evidence_revision.py "$head_sha" --reviewed-revision "$report_sha"

name: Migration regeneration due

# The cue to regenerate the arxii migration chain (ADR-0276, #4250). Once a
# month, count the migrations added since the current generation and, past
# tools/check_regeneration_due.py's THRESHOLD, open (or comment on) one issue
# saying a regeneration is due. An issue, not a red run: the nightly replay
# this replaced signalled only through a cron-failure email and stayed red for
# five weeks with nobody looking (#4250).
#
# Needs no database, no Django settings and no `uv sync`: the counter is
# stdlib Python over the migrations directory, and tools/tests runs it against
# the real chain on every PR, so a rename that would break it fails there.
#
# SUPPLY CHAIN: third-party actions are pinned to a full commit SHA, as in
# validate.yml. Re-pin via: gh api repos/<owner>/<repo>/commits/<tag> --jq .sha

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  regeneration-due:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - name: Count incremental migrations
        id: count
        # pipefail: without it, tee's exit status would hide a counter that crashed.
        run: |
          set -euo pipefail
          python tools/check_regeneration_due.py --github-output "$GITHUB_OUTPUT" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Open or update the regeneration issue
        if: steps.count.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COUNT: ${{ steps.count.outputs.count }}
          TITLE: Migration chain regeneration due
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "$REPO" --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" \
              --body "Still due: ${COUNT} incremental migrations since the current generation."
            exit 0
          fi
          body=$(cat <<EOF
          The \`arxii\` migration chain has **${COUNT}** incremental migrations since the
          current generation, at or past the threshold in \`tools/check_regeneration_due.py\`.
          Time to regenerate it (ADR-0276).

          Recipe (\`docs/evennia-quirks.md\` and ADR-0276 have the detail):

          1. Cut the branch from a commit production has **already deployed** (the last
             green "Stand up infra" run's SHA), in a fresh worktree. Never rebase it.
          2. \`just regenerate-migrations\`
          3. \`just verify-regeneration\`: replays the new chain into a scratch database,
             asserts the partition, and diffs it against the model-built schema. It must
             come back with an empty diff.
          4. Open the PR with \`regeneration-report.md\` in its body.

          Filed by \`.github/workflows/migration-regeneration-due.yml\`.
          EOF
          )
          gh issue create --repo "$REPO" --title "$TITLE" --label chore --body "$body"
